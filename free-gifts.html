<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Gifts | THE COLLECTIVE.CO</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f7f4ee;
            color: #304b52;
        }

        .free-gift-page {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 0 80px;
        }

        .free-gift-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-brand {
            color: #6f858a;
            font-size: 12px;
            letter-spacing: 4px;
        }

        .free-gift-header h1 {
            font-size: 42px;
            letter-spacing: 4px;
            margin: 12px 0;
        }

        .free-gift-header p:last-child {
            color: #6f858a;
        }

        .gift-selection-info {
            background: #e8f1f2;
            border: 1px solid #d6e6e8;
            border-radius: 25px;
            padding: 27px;
            margin-bottom: 35px;
            text-align: center;
        }

        .gift-selection-info strong {
            color: #304b52;
            font-size: 18px;
        }

        .gift-selection-count {
            margin-top: 9px;
            color: #6f858a;
            font-size: 14px;
        }

        .free-gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .free-gift-product {
            background: #fffdf8;
            border: 1px solid #dce8e8;
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            transition: 0.25s ease;
        }

        .free-gift-product:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(48, 75, 82, 0.09);
        }

        .free-gift-product.selected {
            border: 2px solid #304b52;
            box-shadow: 0 12px 30px rgba(48, 75, 82, 0.12);
        }

        .free-gift-image {
            width: 100%;
            height: 190px;
            border-radius: 18px;
            background: #f0f3f1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            color: #6f858a;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .free-gift-product small {
            color: #6f858a;
            letter-spacing: 1px;
            font-size: 11px;
        }

        .free-gift-product h3 {
            color: #304b52;
            margin: 8px 0;
            font-size: 18px;
        }

        .free-gift-price {
            color: #304b52;
            font-weight: bold;
            font-size: 15px;
            margin: 10px 0 16px;
        }

        .free-gift-select {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #304b52;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .free-gift-select.remove {
            background: #a8c9ce;
            color: #304b52;
        }

        .gift-locked {
            text-align: center;
            background: #fffdf8;
            border: 1px solid #dce8e8;
            border-radius: 28px;
            padding: 50px 25px;
            max-width: 650px;
            margin: 0 auto;
        }

        .gift-locked-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .gift-locked h2 {
            margin-bottom: 10px;
        }

        .gift-locked p {
            color: #6f858a;
        }

        .gift-confirm {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 35px auto 0;
            padding: 16px;
            border: none;
            border-radius: 25px;
            background: #304b52;
            color: white;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .back-profile {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 22px;
            border: 1px solid #304b52;
            border-radius: 25px;
            color: #304b52;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .back-profile:hover {
            background: #304b52;
            color: #fff;
        }

        @media (max-width: 850px) {
            .free-gift-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .free-gift-grid {
                grid-template-columns: 1fr;
            }

            .free-gift-page {
                width: 94%;
            }

            .free-gift-header h1 {
                font-size: 30px;
            }
        }

    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>
</nav>


<main class="free-gift-page">

    <section class="free-gift-header">

        <p class="profile-brand">
            THE COLLECTIVE.CO
        </p>

        <h1 id="giftTitle">
            FREE GIFT
        </h1>

        <p id="giftDescription">
            Choose your free items.
        </p>

    </section>


    <section class="gift-selection-info">

        <strong id="selectionRule">
            Loading...
        </strong>

        <div
            class="gift-selection-count"
            id="selectionCount"
        >
            0 selected
        </div>

    </section>


    <section
        class="free-gift-grid"
        id="freeGiftGrid"
    ></section>


    <button
        type="button"
        class="gift-confirm"
        id="confirmGifts"
        style="display:none;"
    >
        CONFIRM FREE GIFTS
    </button>


    <a
        href="profile.html"
        class="back-profile"
    >
        ← BACK TO PROFILE
    </a>

</main>


<script src="script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const gift =
        params.get("gift");


    const title =
        document.getElementById("giftTitle");

    const description =
        document.getElementById("giftDescription");

    const rule =
        document.getElementById("selectionRule");

    const count =
        document.getElementById("selectionCount");

    const grid =
        document.getElementById("freeGiftGrid");

    const confirmButton =
        document.getElementById("confirmGifts");


    const totalSpent =
        Number(
            localStorage.getItem(
                "collectiveTotalSpent"
            ) || "0"
        );


    let maximumItems;

    let requiredAmount;


    if (gift === "2") {

        maximumItems = 10;
        requiredAmount = 100000;

        title.textContent =
            "FREE GIFT 2";

        description.textContent =
            "Choose up to 10 free items.";

    } else {

        maximumItems = 5;
        requiredAmount = 50000;

        title.textContent =
            "FREE GIFT 1";

        description.textContent =
            "Choose up to 5 free items.";

    }


    rule.textContent =
        `Spend ₦${requiredAmount.toLocaleString()} to unlock ${maximumItems} free items.`;


    if (totalSpent < requiredAmount) {

        grid.innerHTML = `

            <div class="gift-locked">

                <div class="gift-locked-icon">
                    🎁
                </div>

                <h2>
                    GIFT LOCKED
                </h2>

                <p>
                    You have spent
                    ₦${totalSpent.toLocaleString()}.
                </p>

                <p>
                    Spend another
                    ₦${(requiredAmount - totalSpent).toLocaleString()}
                    to unlock this gift.
                </p>

            </div>

        `;

        return;
    }


    const giftCategories = [
        "Skincare",
        "Accessories",
        "Clothing",
        "Shoes"
    ];


    let giftProducts = [];


    if (typeof productCatalog !== "undefined") {

        productCatalog.forEach(function (product) {

            if (
                giftCategories.includes(
                    product.category
                )
            ) {

                giftProducts.push(product);

            }

        });

    }


    if (giftProducts.length === 0) {

        grid.innerHTML = `
            <div class="gift-locked">
                <div class="gift-locked-icon">🎁</div>
                <h2>NO GIFTS AVAILABLE</h2>
                <p>Please refresh the page and try again.</p>
            </div>
        `;

        return;
    }


    const selectedGifts = [];


    function updateCount() {

        count.textContent =
            `${selectedGifts.length} / ${maximumItems} selected`;


        confirmButton.style.display =
            selectedGifts.length === maximumItems
                ? "block"
                : "none";

    }


    function createGiftCard(product, index) {

        const card =
            document.createElement("div");

        card.className =
            "free-gift-product";


        const price =
            Number(product.min || 0);


        card.innerHTML = `

            <div class="free-gift-image">
                FREE GIFT
            </div>

            <small>
                ${product.category.toUpperCase()}
            </small>

            <h3>
                ${product.name}
            </h3>

            <p class="free-gift-price">
                ₦${price.toLocaleString()} value
            </p>

            <button
                type="button"
                class="free-gift-select"
            >
                SELECT
            </button>

        `;


        const button =
            card.querySelector(
                ".free-gift-select"
            );


        button.addEventListener(
            "click",
            function () {

                const existingIndex =
                    selectedGifts.findIndex(
                        item =>
                            item.index === index
                    );


                if (existingIndex !== -1) {

                    selectedGifts.splice(
                        existingIndex,
                        1
                    );

                    card.classList.remove(
                        "selected"
                    );

                    button.textContent =
                        "SELECT";

                    button.classList.remove(
                        "remove"
                    );

                    updateCount();

                    return;
                }


                if (
                    selectedGifts.length >=
                    maximumItems
                ) {

                    alert(
                        `You can only select ${maximumItems} free items.`
                    );

                    return;
                }


                selectedGifts.push({
                    index: index,
                    name: product.name,
                    category: product.category
                });


                card.classList.add(
                    "selected"
                );

                button.textContent =
                    "SELECTED ✓";

                button.classList.add(
                    "remove"
                );


                updateCount();

            }
        );


        return card;

    }


    giftProducts.forEach(
        function (product, index) {

            grid.appendChild(
                createGiftCard(
                    product,
                    index
                )
            );

        }
    );


    updateCount();


    confirmButton.addEventListener(
        "click",
        function () {

            if (
                selectedGifts.length !==
                maximumItems
            ) {

                return;
            }


            localStorage.setItem(
                gift === "2"
                    ? "collectiveSelectedGift2"
                    : "collectiveSelectedGift1",
                JSON.stringify(
                    selectedGifts
                )
            );


            alert(
                "Your free gifts have been saved! 🎁"
            );


            window.location.href =
                "profile.html";

        }
    );

});

</script>

</body>
</html>
