<section id="productsSection" class="admin-section">
    <div class="product-toolbar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <div>
            <h2>Products</h2>
            <p>Manage and add products connected to your Shop.</p>
        </div>
        <button id="addNewProductBtn" class="shop-button" type="button" style="background: #304b52; color: white; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: bold; cursor: pointer;">
            + ADD NEW PRODUCT
        </button>
    </div>

    <div id="productFormBox" class="product-form-box">
        <h2 id="productFormTitle">Edit Product</h2>
        <form id="productForm">
            <input id="productId" type="hidden">
            <div class="form-grid">
                <div class="form-field">
                    <label>PRODUCT NAME</label>
                    <input id="productName" type="text" required>
                </div>

                <div class="form-field">
                    <label>CATEGORY</label>
                    <select id="productCategory">
                        <option value="Skincare">Skincare</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Shoes">Shoes</option>
                        <option value="Bags">Bags</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>PRICE (₦)</label>
                    <input id="productPrice" type="number" min="0" required>
                </div>

                <div class="form-field">
                    <label>STOCK</label>
                    <input id="productStock" type="number" min="0" value="10" required>
                </div>

                <div class="form-field">
                    <label>SIZE</label>
                    <input id="productSize" type="text" placeholder="e.g. Medium, 50ml">
                </div>

                <div class="form-field">
                    <label>COLOURS</label>
                    <input id="productColors" type="text" placeholder="Pink, Brown, Clear">
                </div>

                <div class="form-field full">
                    <label>DESCRIPTION</label>
                    <textarea id="productDescription" placeholder="Enter product details..."></textarea>
                </div>

                <div class="form-field full">
                    <label>PRODUCT IMAGE URL</label>
                    <input id="productImage" type="url" placeholder="https://example.com/image.jpg">
                    <img id="productImagePreview" class="image-preview" alt="Product preview">
                </div>
            </div>

            <div class="form-actions">
                <button class="save-product" type="submit">SAVE PRODUCT</button>
                <button id="cancelProduct" class="cancel-product" type="button">CANCEL</button>
            </div>
        </form>
    </div>

    <div id="productsContainer" class="product-grid-admin">
        <div class="empty">Loading products...</div>
    </div>
</section>
