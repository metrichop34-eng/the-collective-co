<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO - Shop</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --accent-bg: #f5f5f5;
            --border-color: #e0e0e0;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .cart-indicator {
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Category Filter Navigation */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            text-transform: capitalize;
            transition: background 0.2s, color 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--text-color);
            color: #ffffff;
            border-color: var(--text-color);
        }

        /* Product Display Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 32px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-image-box {
            background-color: var(--accent-bg);
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 600;
            color: #888888;
            letter-spacing: 0.5px;
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            text-transform: capitalize;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
        }

        .add-cart-btn {
            background: var(--text-color);
            color: #ffffff;
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .add-cart-btn:hover {
            opacity: 0.85;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            color: #666;
            font-size: 15px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">THE COLLECTIVE.CO</div>
    <div class="cart-indicator">Bag (<span id="cart-count">0</span>)</div>
</header>

<div class="container">
    <!-- Category Filters -->
    <div class="filters" id="categoryFilters">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="skincare">Skincare</button>
        <button class="filter-btn" data-category="accesories">Accessories</button>
        <button class="filter-btn" data-category="clothing">Clothing</button>
        <button class="filter-btn" data-category="shoes">Shoes</button>
        <button class="filter-btn" data-category="bags">Bags</button>
        <button class="filter-btn" data-category="others">Others</button>
    </div>

    <!-- Product Grid Container -->
    <div class="product-grid" id="productGrid">
        <div class="empty-state">Loading products...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Insert your actual Firebase credentials here
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];
    const productGrid = document.getElementById("productGrid");
    const filterButtons = document.querySelectorAll(".filter-btn");

    async function fetchShopProducts() {
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            allProducts = [];

            querySnapshot.forEach((docSnapshot) => {
                allProducts.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });

            renderProducts(allProducts);
        } catch (error) {
            console.error("Error loading products:", error);
            productGrid.innerHTML = `<div class="empty-state" style="color: red;">Failed to load catalog from database.</div>`;
        }
    }

    function renderProducts(productsToRender) {
        if (productsToRender.length === 0) {
            productGrid.innerHTML = `<div class="empty-state">No products found in this category.</div>`;
            return;
        }

        productGrid.innerHTML = "";
        productsToRender.forEach(product => {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <div class="product-image-box">
                    ${product.name || 'Product'}
                </div>
                <div class="product-info">
                    <h3 class="product-title">${product.listing || product.name}</h3>
                    <span class="product-price">₦${Number(product.price || 0).toLocaleString()}</span>
                </div>
                <button class="add-cart-btn">Add to Bag</button>
            `;
            productGrid.appendChild(card);
        });
    }

    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            filterButtons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            const category = button.getAttribute("data-category");
            if (category === "All") {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        });
    });

    fetchShopProducts();
</script>

</body>
</html>
