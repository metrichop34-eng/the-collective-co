        /* =========================

        /* =========================
           MOBILE

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);

        }

        @media (max-width: 520px) {

            nav {
                padding: 15px;

            .admin-container {

            .admin-header {

            }

            .admin-header h1 {
                font-size: 25px;

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card {
                padding: 16px;

            .stat-card strong {

            }

            .order-card {
                padding: 18px;
            }

            .order-product {
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="admin-logo">
        THE COLLECTIVE.CO
    </div>

    <div class="admin-badge">
        ADMIN DASHBOARD
    </div>

</nav>


<main class="admin-container">


    <section class="admin-header">

        <h1>
            Orders
        </h1>

        <p>
            Manage customer orders and payment confirmations.
        </p>

    </section>


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat-card">

            <span>
                TOTAL ORDERS
            </span>

            <strong id="totalOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                PAYMENT CHECKING
            </span>

            <strong id="checkingOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                APPROVED
            </span>

            <strong id="approvedOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                TOTAL SALES
            </span>

            <strong id="totalSales">
                ₦0
            </strong>

        </div>

    </section>


    <!-- FILTERS -->

    <div class="controls">

        <button
            class="filter-button active"
            data-filter="all"
        >
            ALL
        </button>

        <button
            class="filter-button"
            data-filter="payment-checking"
        >
            PAYMENT CHECKING
        </button>

        <button
            class="filter-button"
            data-filter="approved"
        >
            APPROVED
        </button>

        <button
            class="filter-button"
            data-filter="rejected"
        >
            REJECTED
        </button>

    </div>


    <!-- ORDERS -->

    <section id="ordersContainer"></section>


</main>


<script>

    let currentFilter = "all";


    /* =========================
       GET ORDERS
    ========================= */

    function getOrders() {

        try {

            const orders =
                JSON.parse(
                    localStorage.getItem(
                        "collectiveOrders"
                    ) || "[]"
                );

            return Array.isArray(orders)
                ? orders
                : [];

        } catch (error) {

            return [];

        }

    }


    /* =========================
       SAVE ORDERS
    ========================= */

    function saveOrders(orders) {

        localStorage.setItem(
            "collectiveOrders",
            JSON.stringify(orders)
        );

    }


    /* =========================
       FORMAT MONEY
    ========================= */

    function money(amount) {

        return "₦" +
            Number(
                amount || 0
            ).toLocaleString();

    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(date) {

        if (!date) return "Unknown date";

        const d =
            new Date(date);

        if (
            Number.isNaN(
                d.getTime()
            )
        ) {

            return "Unknown date";

        }

        return d.toLocaleString();

    }


    /* =========================
       STATUS
    ========================= */

    function statusLabel(status) {

        if (
            status ===
            "payment-checking"
        ) {

            return "PAYMENT CHECKING";

        }

        if (
            status ===
            "approved"
        ) {

            return "APPROVED";

        }

        if (
            status ===
            "rejected"
        ) {

            return "REJECTED";

        }

        if (
            status ===
            "delivered"
        ) {

            return "DELIVERED";

        }

        return String(
            status || "UNKNOWN"
        ).toUpperCase();

    }


    function statusClass(status) {

        if (
            status ===
            "payment-checking"
        ) {

            return "status-checking";

        }

        if (
            status ===
            "approved"
        ) {

            return "status-approved";

        }

        if (
            status ===
            "rejected"
        ) {

            return "status-rejected";

        }

        if (
            status ===
            "delivered"
        ) {

            return "status-delivered";

        }

        return "status-checking";

    }


    /* =========================
       UPDATE STATISTICS
    ========================= */

    function updateStats(orders) {

        const total =
            orders.length;


        const checking =
            orders.filter(
                order =>
                    order.status ===
                    "payment-checking"
            ).length;


        const approved =
            orders.filter(
                order =>
                    order.status ===
                        "approved" ||
                    order.status ===
                        "delivered"
            ).length;


        const sales =
            orders
                .filter(
                    order =>
                        order.status ===
                            "approved" ||
                        order.status ===
                            "delivered"
                )
                .reduce(
                    (
                        total,
                        order
                    ) =>
                        total +
                        Number(
                            order.total || 0
                        ),
                    0
                );


        document.getElementById(
            "totalOrders"
        ).textContent =
            total;


        document.getElementById(
            "checkingOrders"
        ).textContent =
            checking;


        document.getElementById(
            "approvedOrders"
        ).textContent =
            approved;


        document.getElementById(
            "totalSales"
        ).textContent =
            money(sales);

    }


    /* =========================
       RENDER ORDER
    ========================= */

    function renderOrder(order) {

        const customer =
            order.customer || {};


        const items =
            Array.isArray(
                order.items
            )
                ? order.items
                : [];


        const paidItems =
            items.filter(
                item =>
                    !item.isFreeGift
            );


        const freeGifts =
            items.filter(
                item =>
                    item.isFreeGift
            );


        const orderCard =
            document.createElement(
                "article"
            );


        orderCard.className =
            "order-card";


        orderCard.innerHTML = `

            <div class="order-top">

                <div>

                    <div class="order-id">

                        ${order.id || "ORDER"}

                    </div>

                    <div class="order-date">

                        ${formatDate(order.createdAt)}

                    </div>

                </div>


                <div
                    class="status ${statusClass(order.status)}"
                >

                    ${statusLabel(order.status)}

                </div>

            </div>


            <div class="customer-section">

                <h3>
                    CUSTOMER
                </h3>

                <p>
                    <strong>Name:</strong>
                    ${customer.firstName || ""}
                    ${customer.lastName || ""}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${customer.phone || "Not provided"}
                </p>

                <p>
                    <strong>Address:</strong>
                    ${customer.address || "Not provided"}
                </p>

            </div>


            <div class="products-section">

                <h3>
                    PRODUCTS
                </h3>


                ${
                    paidItems.length
                        ? paidItems.map(
                            item => `

                                <div class="order-product">

                                    <div class="product-info">

                                        <strong>
                                            ${item.name || "Product"}
                                        </strong>

                                        <small>

                                            Quantity:
                                            ${item.quantity || 1}

                                            ${
                                                item.color
                                                    ? ` • Shade: ${item.color}`
                                                    : ""
                                            }

                                        </small>

                                    </div>


                                    <div class="product-price">

                                        ${money(
                                            Number(item.price || 0) *
                                            Number(item.quantity || 1)
                                        )}

                                    </div>

                                </div>

                            `
                        ).join("")
                        : `
                            <p>
                                No paid products.
                            </p>
                          `
                }

            </div>


            ${
                freeGifts.length
                    ? `

                        <div class="free-gifts-box">

                            <h3>
                                🎁 FREE GIFTS
                            </h3>

                            ${freeGifts.map(
                                gift => `

                                    <div class="gift-item">

                                        ${gift.name || "Gift"}
                                        — ₦0

                                    </div>

                                `
                            ).join("")}

                        </div>

                      `
                    : ""
            }


            <div class="order-total">

                <div class="total-row">

                    <span>
                        Shopping total
                    </span>

                    <strong>
                        ${money(
                            order.originalTotal
                        )}
                    </strong>

                </div>


                <div class="total-row">

                    <span>
                        Points used
                    </span>

                    <strong>
                        ${order.pointsUsed || 0}
                    </strong>

                </div>


                <div class="total-row grand-total">

                    <span>
                        CUSTOMER TOTAL
                    </span>

                    <strong>
                        ${money(order.total)}
                    </strong>

                </div>

            </div>


            <div class="order-actions">

                ${
                    order.status ===
                    "payment-checking"
                        ? `

                            <button
                                class="approve-button"
                                data-action="approve"
                                data-id="${order.id}"
                            >
                                ✓ APPROVE PAYMENT
                            </button>

                            <button
                                class="reject-button"
                                data-action="reject"
                                data-id="${order.id}"
                            >
                                ✕ REJECT PAYMENT
                            </button>

                          `
                        : ""
                }


                ${
                    order.status ===
                    "approved"
                        ? `

                            <button
                                class="delivery-button"
                                data-action="delivered"
                                data-id="${order.id}"
                            >
                                📦 MARK DELIVERED
                            </button>

                          `
                        : ""
                }

            </div>

        `;


        return orderCard;

    }


    /* =========================
       RENDER ALL ORDERS
    ========================= */

    function renderOrders() {

        const container =
            document.getElementById(
                "ordersContainer"
            );


        const orders =
            getOrders();


        updateStats(
            orders
        );


        let filtered =
            orders;


        if (
            currentFilter !==
            "all"
        ) {

            filtered =
                orders.filter(
                    order =>
                        order.status ===
                        currentFilter
                );

        }


        container.innerHTML =
            "";


        if (
            filtered.length ===
            0
        ) {

            container.innerHTML = `

                <div class="empty-orders">

                    <div class="empty-orders-icon">
                        📦
                    </div>

                    <h2>
                        No orders here
                    </h2>

                    <p>
                        Orders will appear here
                        when customers place them.
                    </p>

                </div>

            `;

            return;

        }


        /*
         * Newest orders first.
         */

        filtered
            .slice()
            .reverse()
            .forEach(
                order => {

                    container.appendChild(
                        renderOrder(order)
                    );

                }
            );

    }


    /* =========================
       APPROVE / REJECT / DELIVER
    ========================= */

    document.addEventListener(
        "click",
        function(event) {

            const button =
                event.target.closest(
                    "button[data-action]"
                );


            if (!button) return;


            const action =
                button.dataset.action;


            const id =
                button.dataset.id;


            const orders =
                getOrders();


            const order =
                orders.find(
                    item =>
                        item.id === id
                );


            if (!order) {

                alert(
                    "Order could not be found."
                );

                return;

            }


            /* APPROVE */

            if (
                action ===
                "approve"
            ) {

                const confirmApproval =
                    confirm(
                        "Approve this payment?"
                    );


                if (
                    !confirmApproval
                ) {

                    return;

                }


                order.status =
                    "approved";


                /*
                 * Add the qualifying paid
                 * shopping amount to total spent.
                 */

                const oldSpent =
                    Number(
                        localStorage.getItem(
                            "collectiveTotalSpent"
                        ) || "0"
                    );


                const qualifyingSpend =
                    Number(
                        order.qualifyingSpend ||
                        order.originalTotal ||
                        0
                    );


                localStorage.setItem(
                    "collectiveTotalSpent",
                    String(
                        oldSpent +
                        qualifyingSpend
                    )
                );


                /*
                 * Award points based on
                 * the paid shopping amount.
                 */

                const oldPoints =
                    Number(
                        localStorage.getItem(
                            "collectivePoints"
                        ) || "0"
                    );


                const earnedPoints =
                    Math.floor(
                        qualifyingSpend /
                        1000
                    );


                localStorage.setItem(
                    "collectivePoints",
                    String(
                        oldPoints +
                        earnedPoints
                    )
                );


                saveOrders(
                    orders
                );


                /*
                 * Clear customer's current
                 * cart on this browser.
                 */

                localStorage.removeItem(
                    "collectiveCart"
                );


                /*
                 * Clear selected gifts after
                 * the order has been approved.
                 */

                localStorage.removeItem(
                    "collectiveSelectedFreeGifts"
                );


                localStorage.removeItem(
                    "collectiveGiftCheckoutStarted"
                );


                localStorage.setItem(
                    "collectiveOrderStatus",
                    "approved"
                );


                alert(
                    "Payment approved successfully."
                );


                renderOrders();

                return;

            }


            /* REJECT */

            if (
                action ===
                "reject"
            ) {

                const confirmReject =
                    confirm(
                        "Reject this payment?"
                    );


                if (
                    !confirmReject
                ) {

                    return;

                }


                order.status =
                    "rejected";


                saveOrders(
                    orders
                );


                localStorage.setItem(
                    "collectiveOrderStatus",
                    "rejected"
                );


                alert(
                    "Payment rejected."
                );


                renderOrders();

                return;

            }


            /* DELIVERED */

            if (
                action ===
                "delivered"
            ) {

                const confirmDelivered =
                    confirm(
                        "Mark this order as delivered?"
                    );


                if (
                    !confirmDelivered
                ) {

                    return;

                }


                order.status =
                    "delivered";


                saveOrders(
                    orders
                );


                renderOrders();

            }

        }
    );


    /* =========================
       FILTER BUTTONS
    ========================= */

    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        document
                            .querySelectorAll(
                                ".filter-button"
                            )
                            .forEach(
                                btn =>
                                    btn.classList
                                        .remove(
                                            "active"
                                        )
                            );


                        button.classList.add(
                            "active"
                        );


                        currentFilter =
                            button.dataset.filter;


                        renderOrders();

                    }
                );

            }
        );


    /* =========================
       START
    ========================= */

    renderOrders();


    /*
     * Refresh automatically so the
     * dashboard notices new orders.
     */

    setInterval(
        renderOrders,
        2000
    );

</script>

</body>

</html>
