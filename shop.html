```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | THE COLLECTIVE.CO</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           FREE GIFTS
        ========================= */

        .free-gifts-section {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
            padding: 28px;
            box-sizing: border-box;
            background: #faf7f2;
            border-radius: 24px;
            display: none;
        }

        .free-gifts-section h2 {
            text-align: center;
            margin: 0 0 8px;
        }

        .free-gifts-section p {
            text-align: center;
            margin: 0 0 24px;
            opacity: 0.7;
        }

        .free-gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 24px;
        }

        .free-gift-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        .free-gift-card img {
            width: 100%;
            max-height: 190px;
            object-fit: contain;
            border-radius: 15px;
        }

        .free-gift-card h3 {
            margin: 14px 0 7px;
        }

        .free-gift-badge {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            background: #f2ebe2;
            font-size: 12px;
            font-weight: 600;
        }


        /* =========================
           MORE SPACIOUS CART
        ========================= */

        #cartPopup {
            padding: 25px;
            box-sizing: border-box;
        }

        #cartPopup .cart-box {
            width: min(94%, 580px);
            max-height: 88vh;
            overflow-y: auto;
            padding: 32px;
            box-sizing: border-box;
            border-radius: 28px;
        }

        #cartPopup .cart-box h2 {
            margin-bottom: 28px;
            text-align: center;
        }

        #cartItems {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 25px;
        }

        #cartItems > * {
            border-radius: 18px;
        }

        #cartPopup .cart-total {
            margin-top: 22px;
            padding: 20px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            box-sizing: border-box;
        }

        #cartPopup .checkout-button {
            width: 100%;
            margin-top: 22px;
            padding: 16px;
            border-radius: 18px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .free-gifts-section {
                width: 94%;
                padding: 22px 16px;
            }

            .free-gifts-grid {
                grid-template-columns: 1fr;
            }

            #cartPopup {
                padding: 12px;
            }

            #cartPopup .cart-box {
                width: 96%;
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <a href="index.html">Home</a>

        <a href="shop.html">Shop</a>

        <a href="index.html">About</a>

        <a href="contact.html">Contact</a>

        <a href="#" id="categoryBtn">Category</a>

        <a href="profile.html">Profile</a>

        <button
            id="cartBtn"
            class="cart-button"
            type="button"
        >
            🛒 Cart <span id="cartCount">0</span>
        </button>

    </nav>


    <!-- =========================
         CATEGORY MENU
    ========================= -->

    <div
        id="categoryMenu"
        class="collective-categories"
    ></div>


    <!-- =========================
         SHOP HEADER
    ========================= -->

    <div class="shop-header">

        <h1>SHOP</h1>

        <div class="bear">🧸</div>

        <p>Find something you love.</p>

        <div class="search-bar">

            <input
                type="text"
                id="productSearch"
                placeholder="Search products..."
            >

            <button
                id="searchButton"
                type="button"
            >
                🔍
            </button>

        </div>

    </div>


    <!-- =========================
         GIFT SPENDING PROGRESS
    ========================= -->

    <div
        id="giftSpendBar"
        style="
            display:none;
            width:90%;
            max-width:700px;
            margin:20px auto;
            padding:18px;
            box-sizing:border-box;
            background:#f8f3ed;
            border-radius:18px;
            text-align:center;
        "
    >

        <div
            id="giftSpendMessage"
            style="
                font-weight:600;
                margin-bottom:10px;
            "
        ></div>

        <div
            style="
                width:100%;
                height:10px;
                background:#e5e5e5;
                border-radius:20px;
                overflow:hidden;
            "
        >

            <div
                id="giftSpendFill"
                style="
                    width:0%;
                    height:100%;
                    border-radius:20px;
                    transition:width 0.3s ease;
                "
            ></div>

        </div>

        <div
            id="giftSpendAmount"
            style="
                margin-top:10px;
                font-size:14px;
            "
        >
            ₦0
        </div>

    </div>


    <!-- =========================
         FREE GIFTS
         Products unlocked as gifts
         will be placed here.
    ========================= -->

    <section
        id="freeGiftsSection"
        class="free-gifts-section"
    >

        <h2>FREE GIFTS 🎁</h2>

        <p>
            Your unlocked gifts will appear here.
        </p>

        <div
            id="freeGiftsGrid"
            class="free-gifts-grid"
        ></div>

    </section>


    <!-- =========================
         NO PRODUCTS MESSAGE
    ========================= -->

    <p class="no-products">
        No products found.
    </p>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <div
        class="product-grid"
        id="productGrid"
    ></div>


    <!-- =========================
         CART POPUP
    ========================= -->

    <div
        id="cartPopup"
        class="cart-popup"
    >

        <div class="cart-box">

            <button
                id="closeCart"
                class="close-cart"
                type="button"
            >
                ×
            </button>


            <h2>Your Cart</h2>


            <div id="cartItems">

                <p>Your cart is empty.</p>

            </div>


            <div class="cart-total">

                <strong>
                    Total:
                </strong>

                <strong id="cartTotal">
                    ₦0
                </strong>

            </div>


            <button
                id="checkoutBtn"
                class="checkout-button"
                type="button"
            >
                CHECKOUT
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="script.js"></script>

</body>

</html>
```
