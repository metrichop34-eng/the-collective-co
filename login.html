<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | THE COLLECTIVE.CO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>
</nav>

<main>

    <section class="shop-header">
        <p class="bear">✦</p>
        <h1>WELCOME BACK</h1>
        <p>Sign in to your THE COLLECTIVE.CO account.</p>
    </section>

    <section class="auth-container">

        <h2>LOGIN</h2>

        <label for="loginEmail">Email</label>
        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
        >

        <label for="loginPassword">Password</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

        <button type="button" id="loginBtn">
            LOGIN
        </button>

        <p style="text-align:center; margin-top:20px; color:#71858a;">
            Don't have an account?
            <a href="signup.html" style="color:#304b52; font-weight:bold;">
                SIGN UP
            </a>
        </p>

    </section>

    <div style="text-align:center; margin:25px 0 60px;">
        <a href="index.html"
           style="color:#304b52; text-decoration:none; font-weight:bold;">
            ← BACK HOME
        </a>
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
