<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO - Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #FFFDF8; color: #304B52; margin: 0; padding: 0; }
        nav { background: #304B52; padding: 15px 30px; text-align: right; }
        nav a { color: #FFFDF8; text-decoration: none; font-weight: bold; }
        .admin-container { max-width: 900px; margin: 50px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .admin-card { background: #FFFDF8; border: 1px solid #DCEFF2; border-radius: 20px; padding: 30px; box-sizing: border-box; }
        .admin-card h2 { color: #304B52; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #6F858A; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #A8C9CE; border-radius: 10px; background-color: #FFFDF8; color: #304B52; box-sizing: border-box; outline: none; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid #DCEFF2; color: #304B52; text-align: left; }
        th { background: #E8F1F2; }
    </style>
</head>
<body>

    <nav>
        <a href="shop.html">View Live Shop</a>
    </nav>

    <div class="admin-container">
        <!-- Add Product Form -->
        <div class="admin-card">
            <h2>Add New Product</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" required placeholder="e.g. Polka Dot Scrunchie">
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (₦)</label>
                    <input type="number" id="productPrice" required placeholder="e.g. 5000">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="editProductCategory">
    <option value="accessories">Accessories</option>
    <option value="clothing">Clothing</option>
    <option value="shoes">Shoes</option>
    <option value="bags">Bags</option>
    <option value="skincare">Skincare</option>
    <option value="others">Others</option>
</select>
                </div>

                <div class="form-group">
                    <label for="productImage">Product Image File</label>
                    <input type="file" id="productImage" accept="image/*" required>
                </div>

                <button id="submitBtn" type="submit" style="display: block; width: 100%; padding: 14px; background-color: #304B52; color: #FFFDF8; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px;">
                    Save Product
                </button>
            </form>
        </div>

        <!-- Inventory Table -->
        <div class="admin-card">
            <h2>Live Inventory</h2>
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminProductTable">
                    <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAiFa8h-LM0tKlfLZ9OyqlsgkMtDU5oj1s",
            authDomain: "the-collectiveco-orders.firebaseapp.com",
            projectId: "the-collectiveco-orders",
            storageBucket: "the-collectiveco-orders.firebasestorage.app",
            messagingSenderId: "543435699346",
            appId: "1:543435699346:web:886ff03c71fb546dc7a24b",
            measurementId: "G-7GP25TW6JH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productForm = document.getElementById("productForm");
        const adminProductTable = document.getElementById("adminProductTable");
        const submitBtn = document.getElementById("submitBtn");

        // Helper function to convert uploaded image file into a local Base64 string
        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function loadAdminInventory() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                adminProductTable.innerHTML = "";
                if (querySnapshot.empty) {
                    adminProductTable.innerHTML = `<tr><td colspan="4" style="text-align: center;">No products found.</td></tr>`;
                    return;
                }
                querySnapshot.forEach((docSnapshot) => {
                    const product = docSnapshot.data();
                    const imgUrl = product.imageUrl || product.image || '';
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${imgUrl ? `<img src="${imgUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:6px;">` : '🛍️'}</td>
                        <td>${product.name || product.listing || 'Unnamed'}</td>
                        <td>₦${Number(product.price || 0).toLocaleString()}</td>
                        <td><button class="btn-delete" data-id="${docSnapshot.id}" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Delete</button></td>
                    `;
                    adminProductTable.appendChild(row);
                });

                document.querySelectorAll(".btn-delete").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const id = e.target.getAttribute("data-id");
                        if (confirm("Delete this product?")) {
                            await deleteDoc(doc(db, "products", id));
                            loadAdminInventory();
                        }
                    });
                });
            } catch (err) {
                console.error("Error loading inventory:", err);
            }
        }

        productForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("productName").value.trim();
            const price = Number(document.getElementById("productPrice").value);
            const category = document.getElementById("category").value;
            const fileInput = document.getElementById("productImage");
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select an image file.");
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "Processing Image & Saving...";

                // Convert image to Base64 so it bypasses Firebase Storage CORS and permission issues entirely
                const base64Image = await convertImageToBase64(file);

                // Save product document directly to Firestore
                await addDoc(collection(db, "products"), {
                    name: name,
                    listing: name,
                    price: price,
                    category: category,
                    imageUrl: base64Image,
                    image: base64Image,
                    createdAt: new Date()
                });

                alert("Product added successfully!");
                productForm.reset();
                loadAdminInventory();
            } catch (error) {
                alert("Error: " + error.message);
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Save Product";
            }
        });

        loadAdminInventory();
    </script>
</body>
</html>
