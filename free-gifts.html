<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Gifts | THE COLLECTIVE.CO</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .free-gift-page {
            width: min(1150px, 92%);
            margin: 0 auto;
            padding-bottom: 70px;
        }

        .free-gift-header {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .free-gift-header h1 {
            color: #304b52;
            font-size: 42px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .free-gift-header p {
            color: #71858a;
            margin: 8px 0;
        }

        .gift-rule-box {
            width: min(700px, 100%);
            margin: 0 auto 30px;
            padding: 20px;
            background: #ffffff;
            border: 1px solid #e4e9e8;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
        }

        #selectionRule {
            color: #304b52;
            font-weight: bold;
        }

        #selectionCount {
            margin-top: 8px;
            color: #71858a;
            font-size: 14px;
        }

        .free-gift-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .free-gift-card {
            background: #ffffff;
            border: 1px solid #e4e9e8;
            border-radius: 22px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
            transition: 0.25s ease;
        }

        .free-gift-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(48, 75, 82, 0.11);
        }

        .free-gift-image {
            width: 100%;
            height: 210px;
            border-radius: 17px;
            background: #f2f5f3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
            color: #8da0a4;
            font-size: 13px;
            text-align: center;
        }

        .free-gift-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .free-gift-card h3 {
            color: #304b52;
            margin-bottom: 5px;
        }

        .free-gift-card p {
            color: #71858a;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .gift-select-button {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 13px;
            background: #a8c9ce;
            color: #203c43;
            font-weight: bold;
            transition: 0.25s ease;
        }

        .gift-select-button:hover {
            background: #91b9bf;
            transform: translateY(-2px);
        }

        .gift-select-button.selected {
            background: #304b52;
            color: #ffffff;
        }

        .gift-select-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
        }

        .gift-message {
            text-align: center;
            padding: 45px 20px;
            background: #ffffff;
            border: 1px solid #e4e9e8;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
        }

        .gift-message h2 {
            color: #304b52;
            margin-bottom: 10px;
        }

        .gift-message p {
            color: #71858a;
        }

        .gift-back {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #304b52;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 850px) {
            .free-gift-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {
            .free-gift-grid {
                grid-template-columns: 1fr;
            }

            .free-gift-header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>
</nav>

<main class="free-gift-page">

    <section class="free-gift-header">
        <p class="bear">✦</p>
        <h1 id="giftTitle">FREE GIFT</h1>
        <p id="giftDescription">Choose your free items below.</p>
    </section>

    <div class="gift-rule-box">
        <strong id="selectionRule">Loading gift details...</strong>
        <div id="selectionCount">0 selected</div>
    </div>

    <section id="freeGiftGrid" class="free-gift-grid"></section>

    <a href="profile.html" class="gift-back">
        ← BACK TO PROFILE
    </a>

</main>

<script src="script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const giftNumber = params.get("gift") || "1";

    const title = document.getElementById("giftTitle");
    const description = document.getElementById("giftDescription");
    const rule = document.getElementById("selectionRule");
    const count = document.getElementById("selectionCount");
    const grid = document.getElementById("freeGiftGrid");

    const totalSpent = Number(
        localStorage.getItem("collectiveTotalSpent") || 0
    );

    let maximumItems = 0;
    let requiredAmount = 0;
    let storageKey = "";

    if (giftNumber === "2") {
        maximumItems = 10;
        requiredAmount = 100000;
        storageKey = "collectiveGift2";

        title.textContent = "FREE GIFT 2";
        description.textContent =
            "You unlocked the second reward tier. Choose your free items.";
        rule.textContent =
            "Choose up to 10 free items after spending ₦100,000.";
    } else {
        maximumItems = 5;
        requiredAmount = 50000;
        storageKey = "collectiveGift1";

        title.textContent = "FREE GIFT 1";
        description.textContent =
            "Choose your free items from the collection.";
        rule.textContent =
            "Choose up to 5 free items after spending ₦50,000.";
    }

    if (totalSpent < requiredAmount) {

        grid.innerHTML = `
            <div class="gift-message" style="grid-column:1/-1;">
                <h2>Not unlocked yet ✦</h2>
                <p>
                    You have spent ₦${totalSpent.toLocaleString()}.
                </p>
                <p>
                    Spend ₦${requiredAmount.toLocaleString()}
                    to unlock this reward.
                </p>
            </div>
        `;

        count.textContent = "Reward locked";

        return;
    }

    let savedSelections = [];

    try {
        savedSelections = JSON.parse(
            localStorage.getItem(storageKey) || "[]"
        );

        if (!Array.isArray(savedSelections)) {
            savedSelections = [];
        }
    } catch (error) {
        savedSelections = [];
    }

    function updateCount() {
        count.textContent =
            savedSelections.length +
            " / " +
            maximumItems +
            " selected";
    }

    function saveSelections() {
        localStorage.setItem(
            storageKey,
            JSON.stringify(savedSelections)
        );
    }

    function renderProducts() {

        grid.innerHTML = "";

        /*
         * Use the product catalogue already loaded by script.js.
         * This does NOT replace or modify your normal shop products.
         */
        const giftProducts =
            typeof productCatalog !== "undefined"
                ? productCatalog
                : [];

        if (!giftProducts.length) {
            grid.innerHTML = `
                <div class="gift-message" style="grid-column:1/-1;">
                    <h2>Gift items are loading...</h2>
                    <p>Please refresh the page.</p>
                </div>
            `;
            return;
        }

        giftProducts.forEach(function (product, index) {

            const productId =
                "gift-" +
                String(index) +
                "-" +
                String(product.name || "item")
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, "-");

            const isSelected =
                savedSelections.includes(productId);

            const card = document.createElement("article");
            card.className = "free-gift-card";

            const imageHTML = product.image
                ? `<img src="${product.image}" alt="${product.name}">`
                : `<span>THE COLLECTIVE.CO</span>`;

            card.innerHTML = `
                <div class="free-gift-image">
                    ${imageHTML}
                </div>

                <h3>${product.name}</h3>

                <p>
                    ${product.category || "THE COLLECTIVE.CO"}
                </p>

                <button
                    type="button"
                    class="gift-select-button ${isSelected ? "selected" : ""}"
                    data-product-id="${productId}"
                >
                    ${isSelected ? "✓ SELECTED" : "SELECT GIFT"}
                </button>
            `;

            const button =
                card.querySelector(".gift-select-button");

            button.addEventListener("click", function () {

                const id = button.dataset.productId;

                if (savedSelections.includes(id)) {

                    savedSelections =
                        savedSelections.filter(function (item) {
                            return item !== id;
                        });

                    button.classList.remove("selected");
                    button.textContent = "SELECT GIFT";

                    saveSelections();
                    updateCount();

                    return;
                }

                if (savedSelections.length >= maximumItems) {
                    alert(
                        "You can only select " +
                        maximumItems +
                        " free items."
                    );
                    return;
                }

                savedSelections.push(id);

                button.classList.add("selected");
                button.textContent = "✓ SELECTED";

                saveSelections();
                updateCount();
            });

            grid.appendChild(card);
        });

        updateCount();
    }

    renderProducts();

});
</script>

    <script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const giftNumber = params.get("gift") || "1";

    const selectionRule = document.getElementById("selectionRule");
    const selectionCount = document.getElementById("selectionCount");
    const freeGiftGrid = document.getElementById("freeGiftGrid");

    let maxGifts;
    let priceLimit;
    let requiredAmount;

    if (giftNumber === "2") {
        maxGifts = 10;
        priceLimit = 10000;
        requiredAmount = 100000;
    } else {
        maxGifts = 5;
        priceLimit = 50000;
        requiredAmount = 50000;
    }

    const totalSpent =
        Number(localStorage.getItem("collectiveTotalSpent")) || 0;

    const unlocked =
        totalSpent >= requiredAmount ||
        localStorage.getItem(
            giftNumber === "2"
                ? "collectiveGift2"
                : "collectiveGift1"
        ) === "true";

    if (!unlocked) {
        selectionRule.textContent =
            `Spend ₦${requiredAmount.toLocaleString()} to unlock this gift.`;

        selectionCount.textContent = "Gift locked.";

        freeGiftGrid.innerHTML = `
            <div class="product">
                <h2>Gift Locked 🔒</h2>
                <p>
                    Spend ₦${requiredAmount.toLocaleString()}
                    to unlock your free gifts.
                </p>
            </div>
        `;

        return;
    }

    selectionRule.textContent =
        `Choose ${maxGifts} free gifts from products priced at ₦${priceLimit.toLocaleString()} or less.`;

    let selectedGifts = [];

    const selectionStorage =
        giftNumber === "2"
            ? "collectiveGift2Selections"
            : "collectiveGift1Selections";

    try {
        selectedGifts =
            JSON.parse(localStorage.getItem(selectionStorage)) || [];
    } catch {
        selectedGifts = [];
    }

    const eligibleProducts = productCatalog.filter(product => {
        return Number(product.price) <= priceLimit;
    });

    function updateCount() {
        selectionCount.textContent =
            `${selectedGifts.length} / ${maxGifts} gifts selected`;
    }

    function renderProducts() {

        freeGiftGrid.innerHTML = "";

        eligibleProducts.forEach((product, index) => {

            const id = `${giftNumber}-${index}`;

            const selected = selectedGifts.includes(id);

            const card = document.createElement("div");

            card.className = "product";

            card.innerHTML = `
                <h2>${product.name}</h2>

                <p>
                    ${product.category || ""}
                </p>

                <p>
                    ₦${Number(product.price).toLocaleString()}
                </p>

                <button class="shop-button">
                    ${selected ? "✓ SELECTED" : "SELECT GIFT"}
                </button>
            `;

            card.querySelector("button").addEventListener("click", () => {

                if (selectedGifts.includes(id)) {

                    selectedGifts =
                        selectedGifts.filter(item => item !== id);

                } else {

                    if (selectedGifts.length >= maxGifts) {
                        alert(
                            `You can only choose ${maxGifts} free gifts.`
                        );
                        return;
                    }

                    selectedGifts.push(id);
                }

                localStorage.setItem(
                    selectionStorage,
                    JSON.stringify(selectedGifts)
                );

                updateCount();
                renderProducts();
            });

            freeGiftGrid.appendChild(card);
        });

        updateCount();
    }

    renderProducts();

});
</script>

</body>
</html>
