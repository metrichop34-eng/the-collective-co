<script src="script.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    /* ==========================================
       DETERMINE GIFT LEVEL
    ========================================== */

    const urlParams = new URLSearchParams(
        window.location.search
    );

    const giftType =
        urlParams.get("gift") || "1";

    const MAX_GIFTS =
        giftType === "2" ? 10 : 5;

    const MAX_GIFT_PRICE = 10000;

    const STORAGE_KEY =
        "collectiveSelectedFreeGifts";

    const grid =
        document.getElementById("freeGiftGrid");

    const giftCount =
        document.getElementById("giftCount");

    const giftSelectionFill =
        document.getElementById("giftSelectionFill");

    const giftSelectionMessage =
        document.getElementById(
            "giftSelectionMessage"
        );

    const giftHeaderMessage =
        document.getElementById(
            "giftHeaderMessage"
        );


    /* ==========================================
       CHANGE TEXT FOR 5 OR 10 GIFTS
    ========================================== */

    if (MAX_GIFTS === 10) {

        giftHeaderMessage.textContent =
            "Choose 10 products from the collection as your free gifts.";

        giftSelectionMessage.textContent =
            "Pick 10 free gifts to continue.";

    }


    /* ==========================================
       LOAD SAVED GIFTS
    ========================================== */

    let selectedGifts = [];

    try {

        selectedGifts =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                ) || "[]"
            );

        if (!Array.isArray(selectedGifts)) {
            selectedGifts = [];
        }

    } catch (error) {

        selectedGifts = [];

    }


    /*
     * IMPORTANT:
     * The Shop system creates scatteredProducts,
     * NOT products.
     */

    const allProducts =
        typeof scatteredProducts !== "undefined"
            ? scatteredProducts
            : [];


    /* ==========================================
       GET ELIGIBLE GIFT PRODUCTS
    ========================================== */

    const giftProducts =
        allProducts.filter(function (product) {

            return (
                product &&
                Number(product.price) <=
                MAX_GIFT_PRICE
            );

        });


    /* ==========================================
       SAVE SELECTIONS
    ========================================== */

    function saveSelections() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(selectedGifts)
        );

    }


    /* ==========================================
       UPDATE SELECTION BAR
    ========================================== */

    function updateSelectionBar() {

        const amount =
            selectedGifts.length;

        giftCount.textContent =
            `${amount} / ${MAX_GIFTS}`;


        const percentage =
            Math.min(
                (amount / MAX_GIFTS) * 100,
                100
            );


        giftSelectionFill.style.width =
            percentage + "%";


        if (amount === 0) {

            giftSelectionMessage.textContent =
                `Pick ${MAX_GIFTS} free gifts to continue.`;

        }

        else if (amount < MAX_GIFTS) {

            const remaining =
                MAX_GIFTS - amount;

            giftSelectionMessage.textContent =
                `${remaining} more gift${remaining === 1 ? "" : "s"} to go.`;

        }

        else {

            giftSelectionMessage.textContent =
                `✓ ${MAX_GIFTS} gifts selected! Taking you to Shop...`;

        }

    }


    /* ==========================================
       GO TO SHOP
    ========================================== */

    function goToShop() {

        setTimeout(function () {

            window.location.href =
                "shop.html";

        }, 900);

    }


    /* ==========================================
       RENDER PRODUCTS
    ========================================== */

    function renderProducts() {

        grid.innerHTML = "";


        if (giftProducts.length === 0) {

            grid.innerHTML = `

                <div class="gift-message">

                    <h2>
                        No gift products found.
                    </h2>

                    <p>
                        Your shop products could not be loaded.
                    </p>

                </div>

            `;

            return;

        }


        giftProducts.forEach(function (product) {

            const productId =
                String(product.id);


            const isSelected =
                selectedGifts.includes(
                    productId
                );


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "free-gift-card" +
                (
                    isSelected
                        ? " selected"
                        : ""
                );


            /* ==================================
               IMAGE
            ================================== */

            let imageHTML =
                `<span>THE COLLECTIVE.CO</span>`;


            if (
                product.image &&
                String(product.image).trim() !== ""
            ) {

                imageHTML = `
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >
                `;

            }


            /* ==================================
               CARD
            ================================== */

            card.innerHTML = `

                <div class="free-gift-image">
                    ${imageHTML}
                </div>

                <h3>
                    ${product.name}
                </h3>

                <p>
                    ${product.category || "THE COLLECTIVE.CO"}
                </p>

                <p class="gift-original-price">
                    ₦${Number(product.price).toLocaleString()}
                </p>

                <p class="gift-free-price">
                    ₦0
                </p>

                <button
                    type="button"
                    class="gift-select-button ${
                        isSelected
                            ? "selected"
                            : ""
                    }"
                >
                    ${
                        isSelected
                            ? "✓ SELECTED"
                            : "SELECT GIFT"
                    }
                </button>

            `;


            const button =
                card.querySelector(
                    ".gift-select-button"
                );


            /* ==================================
               SELECT / UNSELECT
            ================================== */

            button.addEventListener(
                "click",
                function () {

                    const existingIndex =
                        selectedGifts.indexOf(
                            productId
                        );


                    /* UNSELECT */

                    if (existingIndex !== -1) {

                        selectedGifts.splice(
                            existingIndex,
                            1
                        );

                        saveSelections();

                        renderProducts();

                        updateSelectionBar();

                        return;

                    }


                    /* MAXIMUM */

                    if (
                        selectedGifts.length >=
                        MAX_GIFTS
                    ) {

                        alert(
                            `You can only choose ${MAX_GIFTS} free gifts.`
                        );

                        return;

                    }


                    /* SELECT */

                    selectedGifts.push(
                        productId
                    );

                    saveSelections();

                    renderProducts();

                    updateSelectionBar();


                    /* FINISHED */

                    if (
                        selectedGifts.length ===
                        MAX_GIFTS
                    ) {

                        goToShop();

                    }

                }
            );


            grid.appendChild(card);

        });

    }


    /* ==========================================
       START
    ========================================== */

    renderProducts();

    updateSelectionBar();

});

</script>
