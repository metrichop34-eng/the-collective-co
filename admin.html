<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO - Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #FFFDF8; color: #304B52; margin: 0; padding: 0; }
        nav { background: #304B52; padding: 15px 30px; text-align: right; }
        nav a { color: #FFFDF8; text-decoration: none; font-weight: bold; }
        .admin-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .orders-wrapper { max-width: 1000px; margin: 0 auto 50px auto; padding: 0 20px; }
        @media (max-width: 768px) { .admin-container { grid-template-columns: 1fr; margin: 20px auto; } }
        .admin-card { background: #FFFDF8; border: 1px solid #DCEFF2; border-radius: 20px; padding: 25px; box-sizing: border-box; }
        .admin-card h2 { color: #304B52; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #6F858A; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #A8C9CE; border-radius: 10px; background-color: #FFFDF8; color: #304B52; box-sizing: border-box; outline: none; }
        .help-text { font-size: 12px; color: #6F858A; margin-top: 4px; display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid #DCEFF2; color: #304B52; text-align: left; vertical-align: top; }
        th { background: #E8F1F2; }
        .stock-pill { display: inline-block; background: #E8F1F2; color: #304B52; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin: 2px 2px 0 0; }
        .btn-edit { background: #304B52; color: #FFFDF8; border: none; padding: 5px 9px; border-radius: 5px; cursor: pointer; margin-right: 4px; margin-bottom: 4px; }
        .btn-delete { background: #dc3545; color: #FFFDF8; border: none; padding: 5px 9px; border-radius: 5px; cursor: pointer; }
        .error-box { color: #b02a37; background: #f8d7da; padding: 10px; border-radius: 8px; font-size: 13px; }
    </style>
</head>
<body>

    <nav>
        <a href="shop.html">View Live Shop</a>
    </nav>

    <div class="admin-container">
        <!-- Add Product Form -->
        <div class="admin-card">
            <h2>Add New Product</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" required placeholder="e.g. Polka Dot Scrunchie">
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (₦)</label>
                    <input type="number" id="productPrice" required placeholder="e.g. 5000">
                </div>

                <div class="form-group">
                    <label for="productCategory">Category</label>
                    <select id="productCategory">
                        <option value="accessories">Accessories</option>
                        <option value="clothing">Clothing</option>
                        <option value="shoes">Shoes</option>
                        <option value="bags">Bags</option>
                        <option value="skincare">Skincare</option>
                        <option value="others">Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="colorStockInput">Stock Per Color</label>
                    <input type="text" id="colorStockInput" placeholder="e.g. Pink: 1, Black: 4, White: 0">
                    <span class="help-text">Separate colors with commas using <strong>Color: Quantity</strong>.</span>
                </div>

                <div class="form-group">
                    <label for="productImage">Product Image File</label>
                    <input type="file" id="productImage" accept="image/*" required>
                </div>

                <button id="submitBtn" type="submit" style="display: block; width: 100%; padding: 14px; background-color: #304B52; color: #FFFDF8; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px;">
                    Save Product
                </button>
            </form>
        </div>

        <!-- Inventory Table -->
        <div class="admin-card">
            <h2>Live Inventory</h2>
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Item &amp; Color Stock</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminProductTable">
                    <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Orders Section -->
    <div class="orders-wrapper">
        <div class="admin-card">
            <h2>Recent Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Customer &amp; Location</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="adminOrdersTable">
                    <tr><td colspan="4" style="text-align: center;">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAiFa8h-LM0tKlfLZ9OyqlsgkMtDU5oj1s",
            authDomain: "the-collectiveco-orders.firebaseapp.com",
            projectId: "the-collectiveco-orders",
            storageBucket: "the-collectiveco-orders.firebasestorage.app",
            messagingSenderId: "543435699346",
            appId: "1:543435699346:web:886ff03c71fb546dc7a24b",
            measurementId: "G-7GP25TW6JH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productForm = document.getElementById("productForm");
        const adminProductTable = document.getElementById("adminProductTable");
        const adminOrdersTable = document.getElementById("adminOrdersTable");
        const submitBtn = document.getElementById("submitBtn");

        let cachedProducts = {};

        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function parseColorStock(rawText) {
            const colorStock = {};
            let totalStock = 0;

            if (!rawText || !rawText.trim()) {
                return { colorStock, totalStock };
            }

            rawText.split(",").forEach(part => {
                const [rawColor, rawQty] = part.split(":");
                const colorName = (rawColor || "").trim();
                const qty = Math.max(0, Number((rawQty || "").trim()) || 0);

                if (colorName) {
                    const formattedColor = colorName.charAt(0).toUpperCase() + colorName.slice(1);
                    colorStock[formattedColor] = qty;
                    totalStock += qty;
                }
            });

            return { colorStock, totalStock };
        }

        function colorStockToText(colorStock) {
            if (!colorStock || typeof colorStock !== "object") return "";
            return Object.entries(colorStock)
                .map(([color, qty]) => `${color}: ${qty}`)
                .join(", ");
        }

        function formatColorBadges(colorStock) {
            if (!colorStock || typeof colorStock !== "object") return "";
            const entries = Object.entries(colorStock);
            if (entries.length === 0) return "";

            return `<div style="margin-top:4px;">` + entries.map(([color, qty]) => {
                const label = qty > 0 ? `${color}: ${qty}` : `${color}: Out`;
                return `<span class="stock-pill">${label}</span>`;
            }).join("") + `</div>`;
        }

        async function loadAdminInventory() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                adminProductTable.innerHTML = "";
                cachedProducts = {};

                if (querySnapshot.empty) {
                    adminProductTable.innerHTML = `<tr><td colspan="4" style="text-align: center;">No products found in Firestore.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnapshot) => {
                    const product = docSnapshot.data();
                    cachedProducts[docSnapshot.id] = product;

                    const imgUrl = product.imageUrl || product.image || '';
                    const colorBadges = formatColorBadges(product.colorStock);
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${imgUrl ? `<img src="${imgUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:6px;">` : '🛍️'}</td>
                        <td>
                            <strong>${product.name || product.listing || 'Unnamed'}</strong>
                            <div style="font-size:12px; color:#6F858A; text-transform:capitalize;">${product.category || 'others'}</div>
                            ${colorBadges}
                        </td>
                        <td>₦${Number(product.price || 0).toLocaleString()}</td>
                        <td>
                            <button class="btn-edit" data-id="${docSnapshot.id}">Edit</button>
                            <button class="btn-delete" data-id="${docSnapshot.id}">Delete</button>
                        </td>
                    `;
                    adminProductTable.appendChild(row);
                });

                document.querySelectorAll(".btn-edit").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const id = e.target.getAttribute("data-id");
                        const current = cachedProducts[id] || {};
                        const nextCategory = prompt("Category (accessories, clothing, shoes, bags, skincare, others):", current.category || "others");
                        if (nextCategory === null) return;

                        const nextPriceInput = prompt("Price (₦):", current.price || 0);
                        if (nextPriceInput === null) return;

                        const nextStockText = prompt("Stock Per Color (e.g. Pink: 1, Black: 4):", colorStockToText(current.colorStock));
                        if (nextStockText === null) return;

                        const { colorStock, totalStock } = parseColorStock(nextStockText);
                        await updateDoc(doc(db, "products", id), {
                            category: (nextCategory || "others").trim().toLowerCase(),
                            price: Math.max(0, Number(nextPriceInput) || 0),
                            colorStock: colorStock,
                            stock: totalStock
                        });
                        loadAdminInventory();
                    });
                });

                document.querySelectorAll(".btn-delete").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const id = e.target.getAttribute("data-id");
                        if (confirm("Delete this product?")) {
                            await deleteDoc(doc(db, "products", id));
                            loadAdminInventory();
                        }
                    });
                });
            } catch (err) {
                console.error("Error loading inventory:", err);
                adminProductTable.innerHTML = `<tr><td colspan="4"><div class="error-box">Could not load products: ${err.message}</div></td></tr>`;
            }
        }

        async function loadAdminOrders() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                adminOrdersTable.innerHTML = "";

                if (querySnapshot.empty) {
                    adminOrdersTable.innerHTML = `<tr><td colspan="4" style="text-align: center;">No orders found yet.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnapshot) => {
                    const order = docSnapshot.data();
                    const customer = order.customerName || order.name || order.customer || "Customer";
                    const location = order.location || order.zone || order.address || "";
                    const itemsText = Array.isArray(order.items)
                        ? order.items.map(i => `${i.name || i.title || "Item"} (${i.color || "Standard"} x${i.qty || i.quantity || 1})`).join(", ")
                        : (order.itemsSummary || order.item || "Order items");
                    const total = Number(order.total || order.totalAmount || 0).toLocaleString();
                    const status = order.status || "Pending";

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>
                            <strong>${customer}</strong>
                            ${location ? `<div style="font-size:12px; color:#6F858A;">${location}</div>` : ""}
                        </td>
                        <td>${itemsText}</td>
                        <td>₦${total}</td>
                        <td><span class="stock-pill">${status}</span></td>
                    `;
                    adminOrdersTable.appendChild(row);
                });
            } catch (err) {
                console.error("Error loading orders:", err);
                adminOrdersTable.innerHTML = `<tr><td colspan="4"><div class="error-box">Could not load orders: ${err.message}</div></td></tr>`;
            }
        }

        productForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("productName").value.trim();
            const price = Number(document.getElementById("productPrice").value);
            const category = document.getElementById("productCategory").value;
            const rawColorStock = document.getElementById("colorStockInput").value;
            const fileInput = document.getElementById("productImage");
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select an image file.");
                return;
            }

            const { colorStock, totalStock } = parseColorStock(rawColorStock);

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "Processing Image & Saving...";

                const base64Image = await convertImageToBase64(file);

                await addDoc(collection(db, "products"), {
                    name: name,
                    listing: name,
                    price: price,
                    category: category,
                    colorStock: colorStock,
                    stock: totalStock,
                    imageUrl: base64Image,
                    image: base64Image,
                    createdAt: new Date()
                });

                alert("Product added successfully!");
                productForm.reset();
                loadAdminInventory();
            } catch (error) {
                alert("Error: " + error.message);
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Save Product";
            }
        });

        loadAdminInventory();
        loadAdminOrders();
    </script>
</body>
</html>
