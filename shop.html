<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO - Shop</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --accent: #f4f4f4;
            --border: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .filter-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--text-color);
            color: white;
            border-color: var(--text-color);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-image-box {
            background: var(--accent);
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            font-weight: 500;
            color: #777;
        }
        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .product-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
        }
        .add-cart-btn {
            background: var(--text-color);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
            transition: opacity 0.2s;
        }
        .add-cart-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">THE COLLECTIVE.CO</div>
    <div>Cart (<span id="cart-count">0</span>)</div>
</header>

<div class="container">
    <div class="filters" id="categoryFilters">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Skincare">Skincare</button>
        <button class="filter-btn" data-category="Perfume">Perfume</button>
        <button class="filter-btn" data-category="Haircare">Haircare</button>
        <button class="filter-btn" data-category="Apparel">Apparel</button>
    </div>

    <div class="product-grid" id="productGrid">
        <p>Loading catalog...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // TODO: Replace with your actual Firebase configuration object
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];
    const productGrid = document.getElementById("productGrid");
    const filterButtons = document.querySelectorAll(".filter-btn");

    async function fetchShopProducts() {
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            allProducts = [];

            querySnapshot.forEach((docSnapshot) => {
                allProducts.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });

            renderProducts(allProducts);
        } catch (error) {
            console.error("Error loading shop products:", error);
            productGrid.innerHTML = `<p style="color: red;">Failed to load products from database.</p>`;
        }
    }

    function renderProducts(productsToRender) {
        if (productsToRender.length === 0) {
            productGrid.innerHTML = `<p>No products found in this category.</p>`;
            return;
        }

        productGrid.innerHTML = "";
        productsToRender.forEach(product => {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <div class="product-image-box">
                    ${product.name || 'Product'}
                </div>
                <div class="product-info">
                    <h3 class="product-title">${product.listing || product.name}</h3>
                    <span class="product-price">₦${Number(product.price || 0).toLocaleString()}</span>
                </div>
                <button class="add-cart-btn" onclick="alert('Added ${product.name} to cart!')">Add to Cart</button>
            `;
            productGrid.appendChild(card);
        });
    }

    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            filterButtons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            const category = button.getAttribute("data-category");
            if (category === "All") {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        });
    });

    fetchShopProducts();
</script>

</body>
</html>
