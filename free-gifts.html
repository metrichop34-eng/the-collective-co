<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Gifts | THE COLLECTIVE.CO</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .free-gift-page {
            width: min(1150px, 92%);
            margin: 0 auto;
            padding-bottom: 70px;
        }

        .free-gift-header {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .free-gift-header h1 {
            color: #304b52;
            font-size: 42px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .free-gift-header p {
            color: #71858a;
            margin: 8px 0;
        }

        .gift-rule-box {
            width: min(700px, 100%);
            margin: 0 auto 30px;
            padding: 20px;
            background: #ffffff;
            border: 1px solid #e4e9e8;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
            box-sizing: border-box;
        }

        #selectionRule {
            color: #304b52;
            font-weight: bold;
            display: block;
        }

        #selectionCount {
            margin-top: 8px;
            color: #71858a;
            font-size: 14px;
        }

        .free-gift-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .free-gift-card {
            background: #ffffff;
            border: 1px solid #e4e9e8;
            border-radius: 22px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
            transition: 0.25s ease;
            box-sizing: border-box;
        }

        .free-gift-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(48, 75, 82, 0.11);
        }

        .free-gift-image {
            width: 100%;
            height: 210px;
            border-radius: 17px;
            background: #f2f5f3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
            color: #8da0a4;
            font-size: 13px;
            text-align: center;
        }

        .free-gift-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .free-gift-card h3 {
            color: #304b52;
            margin: 8px 0;
        }

        .free-gift-card p {
            color: #71858a;
            font-size: 13px;
            margin: 7px 0;
        }

        .gift-price {
            color: #304b52 !important;
            font-weight: bold;
            font-size: 15px !important;
        }

        .gift-select-button {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 13px;
            background: #a8c9ce;
            color: #203c43;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 8px;
        }

        .gift-select-button:hover {
            background: #91b9bf;
            transform: translateY(-2px);
        }

        .gift-select-button.selected {
            background: #304b52;
            color: #ffffff;
        }

        .gift-message {
            text-align: center;
            padding: 45px 20px;
            background: #ffffff;
            border: 1px solid #e4e9e8;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
            grid-column: 1 / -1;
            box-sizing: border-box;
        }

        .gift-message h2 {
            color: #304b52;
            margin-bottom: 10px;
        }

        .gift-message p {
            color: #71858a;
        }

        .gift-back {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #304b52;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 850px) {
            .free-gift-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {
            .free-gift-grid {
                grid-template-columns: 1fr;
            }

            .free-gift-header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>
</nav>

<main class="free-gift-page">

    <section class="free-gift-header">
        <p class="bear">✦</p>
        <h1 id="giftTitle">FREE GIFT</h1>
        <p id="giftDescription">Choose your free items below.</p>
    </section>

    <div class="gift-rule-box">
        <strong id="selectionRule">Loading gift details...</strong>
        <div id="selectionCount">0 selected</div>
    </div>

    <section id="freeGiftGrid" class="free-gift-grid"></section>

    <a href="profile.html" class="gift-back">
        ← BACK TO PROFILE
    </a>

</main>

<script src="script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const giftNumber = params.get("gift") === "2" ? "2" : "1";

    const title = document.getElementById("giftTitle");
    const description = document.getElementById("giftDescription");
    const rule = document.getElementById("selectionRule");
    const count = document.getElementById("selectionCount");
    const grid = document.getElementById("freeGiftGrid");

    const totalSpent =
        Number(localStorage.getItem("collectiveTotalSpent") || 0);

    let maximumItems;
    let requiredAmount;
    let priceLimit;
    let selectionStorage;

    if (giftNumber === "2") {

        maximumItems = 10;
        requiredAmount = 100000;
        priceLimit = 10000;
        selectionStorage = "collectiveGift2Selections";

        title.textContent = "FREE GIFT 2";

        description.textContent =
            "Choose your free items from the collection.";

        rule.textContent =
            "Choose up to 10 free items priced at ₦10,000 or less after spending ₦100,000.";

    } else {

        maximumItems = 5;
        requiredAmount = 50000;
        priceLimit = 50000;
        selectionStorage = "collectiveGift1Selections";

        title.textContent = "FREE GIFT 1";

        description.textContent =
            "Choose your free items from the collection.";

        rule.textContent =
            "Choose up to 5 free items priced at ₦50,000 or less after spending ₦50,000.";
    }

    const giftUnlocked =
        totalSpent >= requiredAmount ||
        localStorage.getItem(
            giftNumber === "2"
                ? "collectiveGift2"
                : "collectiveGift1"
        ) === "true";

    if (!giftUnlocked) {

        grid.innerHTML = `
            <div class="gift-message">
                <h2>Not unlocked yet ✦</h2>

                <p>
                    You have spent
                    <strong>₦${totalSpent.toLocaleString()}</strong>.
                </p>

                <p>
                    Spend
                    <strong>₦${requiredAmount.toLocaleString()}</strong>
                    to unlock this reward.
                </p>
            </div>
        `;

        count.textContent = "Reward locked";

        return;
    }

    let selectedGifts = [];

    try {

        selectedGifts =
            JSON.parse(
                localStorage.getItem(selectionStorage) || "[]"
            );

        if (!Array.isArray(selectedGifts)) {
            selectedGifts = [];
        }

    } catch (error) {

        selectedGifts = [];
    }

    /*
     * script.js creates 30 versions of every product.
     * We use those generated products here so every gift
     * has an actual price.
     */
    const giftProducts =
        typeof products !== "undefined"
            ? products
            : [];

    /*
     * Only products within the gift price limit qualify.
     */
    const eligibleProducts = giftProducts.filter(function (product) {
        return Number(product.price) <= priceLimit;
    });

    function updateCount() {

        count.textContent =
            `${selectedGifts.length} / ${maximumItems} selected`;
    }

    function saveSelections() {

        localStorage.setItem(
            selectionStorage,
            JSON.stringify(selectedGifts)
        );
    }

    function getGiftId(product) {

        return String(product.id);
    }

    function renderProducts() {

        grid.innerHTML = "";

        if (!eligibleProducts.length) {

            grid.innerHTML = `
                <div class="gift-message">
                    <h2>No gift items available</h2>
                    <p>Please refresh the page.</p>
                </div>
            `;

            return;
        }

        eligibleProducts.forEach(function (product) {

            const productId = getGiftId(product);

            const selected =
                selectedGifts.includes(productId);

            const card =
                document.createElement("article");

            card.className = "free-gift-card";

            const imageHTML = product.image
                ? `<img src="${product.image}" alt="${product.name}">`
                : `<span>THE COLLECTIVE.CO</span>`;

            card.innerHTML = `
                <div class="free-gift-image">
                    ${imageHTML}
                </div>

                <h3>${product.name}</h3>

                <p>
                    ${product.category}
                </p>

                <p class="gift-price">
                    ₦${Number(product.price).toLocaleString()}
                </p>

                <button
                    type="button"
                    class="gift-select-button ${selected ? "selected" : ""}"
                >
                    ${selected ? "✓ SELECTED" : "SELECT GIFT"}
                </button>
            `;

            const button =
                card.querySelector(".gift-select-button");

            button.addEventListener("click", function () {

                const currentIndex =
                    selectedGifts.indexOf(productId);

                if (currentIndex !== -1) {

                    selectedGifts.splice(currentIndex, 1);

                    saveSelections();
                    renderProducts();

                    return;
                }

                if (selectedGifts.length >= maximumItems) {

                    alert(
                        `You can only select up to ${maximumItems} free items.`
                    );

                    return;
                }

                selectedGifts.push(productId);

                saveSelections();
                renderProducts();
            });

            grid.appendChild(card);
        });

        updateCount();
    }

    renderProducts();

});
</script>

</body>
</html>
