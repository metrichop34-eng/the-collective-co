<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | THE COLLECTIVE.CO</title>

    <link rel="stylesheet" href="style.css">

    <style>
        #cartPopup {
            padding: 25px;
            box-sizing: border-box;
        }

        #cartPopup .cart-box {
            width: min(94%, 580px);
            max-height: 88vh;
            overflow-y: auto;
            padding: 32px;
            box-sizing: border-box;
            border-radius: 28px;
        }

        #cartPopup .cart-box h2 {
            margin-bottom: 28px;
            text-align: center;
        }

        #cartItems {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 25px;
        }

        #cartItems > * {
            border-radius: 18px;
        }

        #cartPopup .cart-total {
            margin-top: 22px;
            padding: 20px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            box-sizing: border-box;
        }

        #cartPopup .checkout-button {
            width: 100%;
            margin-top: 22px;
            padding: 16px;
            border-radius: 18px;
        }

        @media (max-width: 600px) {
            #cartPopup {
                padding: 12px;
            }

            #cartPopup .cart-box {
                width: 96%;
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="#" id="categoryBtn">Category</a>
        <a href="profile.html">Profile</a>

        <button
            id="cartBtn"
            class="cart-button"
            type="button"
        >
            🛒 Cart <span id="cartCount">0</span>
        </button>
    </nav>

    <!-- CATEGORY MENU -->
    <div
        id="categoryMenu"
        class="collective-categories"
    ></div>

    <!-- SHOP HEADER -->
    <div class="shop-header">
        <h1>SHOP</h1>
        <div class="bear">🧸</div>
        <p>Find something you love.</p>

        <div class="search-bar">
            <input
                type="text"
                id="productSearch"
                placeholder="Search products..."
            >
            <button
                id="searchButton"
                type="button"
            >
                🔍
            </button>
        </div>
    </div>

    <!-- NO PRODUCTS MESSAGE -->
    <p class="no-products">
        No products found.
    </p>

    <!-- PRODUCTS -->
    <div
        class="product-grid"
        id="productGrid"
    ></div>

    <!-- CART POPUP -->
    <div
        id="cartPopup"
        class="cart-popup"
    >
        <div class="cart-box">
            <button
                id="closeCart"
                class="close-cart"
                type="button"
            >
                ×
            </button>

            <h2>Your Cart</h2>

            <div id="cartItems">
                <p>Your cart is empty.</p>
            </div>

            <div class="cart-total">
                <strong>Total:</strong>
                <strong id="cartTotal">₦0</strong>
            </div>

            <button
                id="checkoutBtn"
                class="checkout-button"
                type="button"
            >
                CHECKOUT
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
<!-- CHECKOUT MODAL & LOCATION CALCULATOR -->
<div id="customCheckoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99999; align-items:center; justify-content:center; padding:15px; box-sizing:border-box;">
    <div style="background:#FFFDF8; border-radius:24px; padding:25px; max-width:480px; width:100%; max-height:90vh; overflow-y:auto; position:relative; box-shadow:0 10px 30px rgba(0,0,0,0.2);">
        <button type="button" id="closeCustomCheckout" style="position:absolute; top:15px; right:20px; background:none; border:none; font-size:24px; cursor:pointer; color:#304B52;">&times;</button>
        
        <h2 style="color:#304B52; margin-top:0; text-align:center;">Complete Your Order</h2>
        
        <!-- Customer Information -->
        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:15px;">
            <input type="text" id="custName" placeholder="Full Name" required style="padding:12px; border:1px solid #DCEFF2; border-radius:12px; font-size:14px;">
            <input type="tel" id="custPhone" placeholder="Phone Number (WhatsApp)" required style="padding:12px; border:1px solid #DCEFF2; border-radius:12px; font-size:14px;">
            <input type="text" id="custAddress" placeholder="Full Delivery Address" required style="padding:12px; border:1px solid #DCEFF2; border-radius:12px; font-size:14px;">
            
            <label style="font-size:13px; font-weight:bold; color:#304B52; margin-top:4px;">Select Your Location:</label>
            <select id="custLocation" style="padding:12px; border:1px solid #DCEFF2; border-radius:12px; font-size:14px; background:white;">
                <option value="ikeja">Lagos - Ikeja</option>
                <option value="lagos_other">Lagos - Outside Ikeja</option>
                <option value="outside_lagos">Outside Lagos</option>
            </select>
        </div>

        <!-- Price & Breakdown Receipt -->
        <div style="background:#E8F1F2; padding:15px; border-radius:16px; margin-bottom:15px; color:#304B52;">
            <strong style="display:block; margin-bottom:8px; font-size:15px;">Price Breakdown:</strong>
            
            <div style="font-size:13px; margin-bottom:8px;">
                <strong>Product(s):</strong>
                <div id="checkoutItemsList" style="margin-top:4px; padding-left:8px;"></div>
            </div>

            <hr style="border:0; border-top:1px solid #DCEFF2; margin:8px 0;">
            
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
                <span>Service Fee:</span>
                <span id="checkoutServiceFee">₦100</span>
            </div>
            
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;">
                <span>Delivery Fee:</span>
                <span id="checkoutDeliveryFee">₦300</span>
            </div>

            <hr style="border:0; border-top:1px solid #DCEFF2; margin:8px 0;">

            <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:bold;">
                <span>Total:</span>
                <span id="checkoutGrandTotal">₦0</span>
            </div>
        </div>

        <button type="button" id="confirmOrderBtn" style="width:100%; padding:14px; background:#304B52; color:white; border:none; border-radius:18px; font-weight:bold; font-size:15px; cursor:pointer;">
            PLACE ORDER
        </button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const checkoutBtn = document.getElementById("checkoutBtn");
    const customModal = document.getElementById("customCheckoutModal");
    const closeCustomModal = document.getElementById("closeCustomCheckout");
    const locationSelect = document.getElementById("custLocation");
    const confirmOrderBtn = document.getElementById("confirmOrderBtn");

    function updateCheckoutSummary() {
        const cart = JSON.parse(localStorage.getItem("collectiveCart") || "[]");
        const itemsList = document.getElementById("checkoutItemsList");
        const serviceEl = document.getElementById("checkoutServiceFee");
        const deliveryEl = document.getElementById("checkoutDeliveryFee");
        const totalEl = document.getElementById("checkoutGrandTotal");

        let productSubtotal = 0;
        itemsList.innerHTML = cart.map(item => {
            const lineTotal = Number(item.price) * Number(item.quantity);
            productSubtotal += lineTotal;
            return `<div style="display:flex; justify-content:space-between;">
                        <span>${item.name} (x${item.quantity})</span>
                        <span>₦${lineTotal.toLocaleString()}</span>
                    </div>`;
        }).join("");

        const loc = locationSelect.value;
        let serviceFee = 0;
        let deliveryFee = 0;

        // Exact Fee Rules
        if (loc === "ikeja") {
            serviceFee = 50;
            deliveryFee = 100;
        } else if (loc === "lagos_other") {
            serviceFee = 100;
            deliveryFee = 200;
        } else {
            serviceFee = 200;
            deliveryFee = 500;
        }

        const grandTotal = productSubtotal + serviceFee + deliveryFee;

        serviceEl.textContent = `₦${serviceFee.toLocaleString()}`;
        deliveryEl.textContent = `₦${deliveryFee.toLocaleString()}`;
        totalEl.textContent = `₦${grandTotal.toLocaleString()}`;
    }

    // Intercept the Checkout button click
    if (checkoutBtn) {
        checkoutBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();

            const cart = JSON.parse(localStorage.getItem("collectiveCart") || "[]");
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            // Close cart drawer if open
            const cartPopup = document.getElementById("cartPopup");
            if (cartPopup) cartPopup.style.display = "none";

            updateCheckoutSummary();
            customModal.style.display = "flex";
        }, true);
    }

    if (locationSelect) {
        locationSelect.addEventListener("change", updateCheckoutSummary);
    }

    if (closeCustomModal) {
        closeCustomModal.addEventListener("click", () => {
            customModal.style.display = "none";
        });
    }

    if (confirmOrderBtn) {
        confirmOrderBtn.addEventListener("click", async () => {
            const name = document.getElementById("custName").value.trim();
            const phone = document.getElementById("custPhone").value.trim();
            const address = document.getElementById("custAddress").value.trim();
            const locText = locationSelect.options[locationSelect.selectedIndex].text;
            const totalText = document.getElementById("checkoutGrandTotal").textContent;
            const cart = JSON.parse(localStorage.getItem("collectiveCart") || "[]");

            if (!name || !phone || !address) {
                alert("Please fill in your name, phone number, and delivery address.");
                return;
            }

            // Save order to Firestore if available
            if (window.firebaseDB?.db && window.firebaseDB?.addDoc) {
                try {
                    await window.firebaseDB.addDoc(
                        window.firebaseDB.collection(window.firebaseDB.db, "orders"),
                        {
                            customerName: name,
                            customerPhone: phone,
                            deliveryAddress: address,
                            locationArea: locText,
                            items: cart,
                            totalPaid: totalText,
                            status: "Pending",
                            createdAt: new Date()
                        }
                    );
                } catch (err) {
                    console.error("Order save error:", err);
                }
            }

            alert(`Thank you, ${name}! Your order (${totalText}) has been placed.`);
            localStorage.removeItem("collectiveCart");
            window.location.reload();
        });
    }
});
</script>
</body>
</html>
