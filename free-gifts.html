<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Gifts | THE COLLECTIVE.CO</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .free-gift-page {
            width: min(1150px, 92%);
            margin: 0 auto;
            padding-bottom: 100px;
        }

        .free-gift-header {
            text-align: center;
            padding: 55px 20px 30px;
        }

        .free-gift-header h1 {
            color: #304B52;
            font-size: 42px;
            letter-spacing: 4px;
            margin: 10px 0;
        }

        .free-gift-header p {
            color: #71858A;
        }

        /* SELECTION BAR */

        .gift-progress-box {
            width: min(700px, 100%);
            margin: 0 auto 35px;
            padding: 20px;
            background: #FFFDF8;
            border: 1px solid #DCEFF2;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
            box-sizing: border-box;
        }

        .gift-progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #304B52;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .gift-progress-track {
            width: 100%;
            height: 13px;
            background: #E8F1F2;
            border-radius: 20px;
            overflow: hidden;
        }

        .gift-progress-fill {
            height: 100%;
            width: 0%;
            background: #304B52;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .gift-progress-message {
            margin-top: 10px;
            color: #71858A;
            font-size: 13px;
        }

        /* PRODUCTS */

        .free-gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .free-gift-card {
            background: #FFFDF8;
            border: 1px solid #DCEFF2;
            border-radius: 22px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(48, 75, 82, 0.07);
            transition: 0.25s ease;
            box-sizing: border-box;
        }

        .free-gift-card:hover {
            transform: translateY(-4px);
        }

        .free-gift-card.selected {
            border: 2px solid #304B52;
        }

        .free-gift-image {
            width: 100%;
            height: 210px;
            border-radius: 17px;
            background: #F2F5F3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #8DA0A4;
            margin-bottom: 15px;
        }

        .free-gift-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .free-gift-card h3 {
            color: #304B52;
            margin: 8px 0;
        }

        .free-gift-card p {
            color: #71858A;
            font-size: 13px;
            margin: 7px 0;
        }

        .old-price {
            color: #9AA7AA !important;
            text-decoration: line-through;
        }

        .free-price {
            color: #304B52 !important;
            font-size: 20px !important;
            font-weight: bold;
        }

        .gift-select-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 13px;
            background: #A8C9CE;
            color: #203C43;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .gift-select-button:hover {
            opacity: 0.85;
        }

        .gift-select-button.selected {
            background: #304B52;
            color: white;
        }

        /* BOTTOM PURCHASE BAR */

        .purchase-progress {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #FFFDF8;
            border-top: 1px solid #DCEFF2;
            padding: 15px 20px;
            box-sizing: border-box;
            z-index: 5000;
            box-shadow: 0 -8px 25px rgba(48, 75, 82, 0.08);
        }

        .purchase-progress-inner {
            width: min(800px, 100%);
            margin: auto;
        }

        .purchase-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #304B52;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .purchase-track {
            width: 100%;
            height: 10px;
            background: #E8F1F2;
            border-radius: 20px;
            overflow: hidden;
        }

        .purchase-fill {
            height: 100%;
            width: 0%;
            background: #304B52;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .purchase-note {
            text-align: center;
            margin-top: 7px;
            color: #71858A;
            font-size: 12px;
        }

        /* LOCKED */

        .gift-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            background: #FFFDF8;
            border: 1px solid #DCEFF2;
            border-radius: 22px;
        }

        .gift-message h2 {
            color: #304B52;
        }

        .gift-message p {
            color: #71858A;
        }

        .gift-back {
            display: block;
            width: fit-content;
            margin: 35px auto;
            color: #304B52;
            text-decoration: none;
            font-weight: bold;
        }

        /* POPUP */

        .gift-popup {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(48, 75, 82, 0.35);
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
        }

        .gift-popup-box {
            width: min(450px, 100%);
            background: #FFFDF8;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(48, 75, 82, 0.2);
            animation: giftPopupIn 0.3s ease;
        }

        @keyframes giftPopupIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .gift-popup-box h2 {
            color: #304B52;
            margin-bottom: 12px;
        }

        .gift-popup-box p {
            color: #71858A;
            font-size: 15px;
        }

        @media (max-width: 850px) {
            .free-gift-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .free-gift-grid {
                grid-template-columns: 1fr;
            }

            .free-gift-header h1 {
                font-size: 32px;
            }

            .purchase-text {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>
</nav>

<main class="free-gift-page">

    <section class="free-gift-header">
        <p>✦</p>
        <h1 id="giftTitle">FREE GIFTS</h1>
        <p id="giftDescription">
            Pick your free gifts.
        </p>
    </section>

    <div class="gift-progress-box">

        <div class="gift-progress-top">
            <span>GIFTS PICKED</span>
            <span id="giftCount">0 / 5</span>
        </div>

        <div class="gift-progress-track">
            <div
                id="giftProgress"
                class="gift-progress-fill">
            </div>
        </div>

        <div
            id="giftProgressMessage"
            class="gift-progress-message">
            Pick your gifts below.
        </div>

    </div>

    <section
        id="freeGiftGrid"
        class="free-gift-grid">
    </section>

    <a href="profile.html" class="gift-back">
        ← BACK TO PROFILE
    </a>

</main>


<!-- PURCHASE PROGRESS -->

<div class="purchase-progress">

    <div class="purchase-progress-inner">

        <div class="purchase-text">

            <span>
                PURCHASE PROGRESS
            </span>

            <span id="purchaseAmount">
                ₦0 / ₦50,000
            </span>

        </div>

        <div class="purchase-track">

            <div
                id="purchaseProgress"
                class="purchase-fill">
            </div>

        </div>

        <div
            id="purchaseNote"
            class="purchase-note">

            Select your gifts first.

        </div>

    </div>

</div>


<script src="script.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const params =
        new URLSearchParams(window.location.search);

    const giftNumber =
        params.get("gift") === "2" ? "2" : "1";


    /*
     * GIFT RULES
     */

    const maxGifts = 5;

    const requiredAmount = 50000;

    const maximumGiftPrice = 10000;


    /*
     * ELEMENTS
     */

    const title =
        document.getElementById("giftTitle");

    const description =
        document.getElementById("giftDescription");

    const giftCount =
        document.getElementById("giftCount");

    const giftProgress =
        document.getElementById("giftProgress");

    const giftProgressMessage =
        document.getElementById("giftProgressMessage");

    const grid =
        document.getElementById("freeGiftGrid");

    const purchaseAmount =
        document.getElementById("purchaseAmount");

    const purchaseProgress =
        document.getElementById("purchaseProgress");

    const purchaseNote =
        document.getElementById("purchaseNote");


    /*
     * TITLE
     */

    if (giftNumber === "2") {

        title.textContent = "FREE GIFTS 2";

        description.textContent =
            "Pick 5 free gifts from products priced at ₦10,000 or less.";

    } else {

        title.textContent = "FREE GIFTS";

        description.textContent =
            "Pick 5 free gifts from products priced at ₦10,000 or less.";

    }


    /*
     * STORAGE
     */

    const selectionStorage =
        giftNumber === "2"
            ? "collectiveGift2Selections"
            : "collectiveGift1Selections";


    let selectedGifts = [];

    try {

        selectedGifts =
            JSON.parse(
                localStorage.getItem(selectionStorage) || "[]"
            );

        if (!Array.isArray(selectedGifts)) {
            selectedGifts = [];
        }

    } catch {

        selectedGifts = [];

    }


    /*
     * USE GENERATED PRODUCTS
     */

    const availableProducts =
        typeof products !== "undefined"
            ? products
            : [];


    /*
     * ONLY PRODUCTS ₦10,000 OR LESS
     */

    const eligibleProducts =
        availableProducts.filter(function (product) {

            return Number(product.price) <= maximumGiftPrice;

        });


    /*
     * SAVE
     */

    function saveSelections() {

        localStorage.setItem(
            selectionStorage,
            JSON.stringify(selectedGifts)
        );

    }


    /*
     * UPDATE SELECTION BAR
     */

    function updateGiftProgress() {

        const amount =
            selectedGifts.length;

        giftCount.textContent =
            `${amount} / ${maxGifts}`;

        const percentage =
            Math.min(
                (amount / maxGifts) * 100,
                100
            );

        giftProgress.style.width =
            percentage + "%";


        if (amount === 0) {

            giftProgressMessage.textContent =
                "Pick 5 gifts to continue.";

        } else if (amount < maxGifts) {

            giftProgressMessage.textContent =
                `${maxGifts - amount} more gift${maxGifts - amount === 1 ? "" : "s"} to go.`;

        } else {

            giftProgressMessage.textContent =
                "✓ 5 gifts picked! Taking you to Shop...";

        }

    }


    /*
     * POPUP
     */

    function showSpendPopup() {

        const popup =
            document.createElement("div");

        popup.className =
            "gift-popup";

        popup.innerHTML = `

            <div class="gift-popup-box">

                <h2>
                    ✦ 5 FREE GIFTS SELECTED
                </h2>

                <p>
                    Spend ₦50,000 to take away
                    your 5 free gifts.
                </p>

            </div>

        `;

        document.body.appendChild(popup);


        setTimeout(function () {

            popup.remove();

        }, 2500);

    }


    /*
     * GO TO SHOP
     */

    function goToShop() {

        showSpendPopup();

        setTimeout(function () {

            window.location.href =
                "shop.html";

        }, 2500);

    }


    /*
     * RENDER PRODUCTS
     */

    function renderProducts() {

        grid.innerHTML = "";

        if (!eligibleProducts.length) {

            grid.innerHTML = `

                <div class="gift-message">

                    <h2>
                        No gift products found.
                    </h2>

                    <p>
                        Please refresh the page.
                    </p>

                </div>

            `;

            return;
        }


        eligibleProducts.forEach(function (product) {

            const id =
                String(product.id);

            const selected =
                selectedGifts.includes(id);


            const card =
                document.createElement("article");

            card.className =
                "free-gift-card" +
                (selected ? " selected" : "");


            const imageHTML =
                product.image

                    ? `<img
                        src="${product.image}"
                        alt="${product.name}"
                    >`

                    : `<span>
                        THE COLLECTIVE.CO
                    </span>`;


            card.innerHTML = `

                <div class="free-gift-image">
                    ${imageHTML}
                </div>

                <h3>
                    ${product.name}
                </h3>

                <p>
                    ${product.category}
                </p>

                <p class="old-price">
                    ₦${Number(product.price).toLocaleString()}
                </p>

                <p class="free-price">
                    ₦0
                </p>

                <button
                    type="button"
                    class="gift-select-button ${
                        selected ? "selected" : ""
                    }"
                >
                    ${
                        selected
                            ? "✓ SELECTED"
                            : "SELECT GIFT"
                    }
                </button>

            `;


            const button =
                card.querySelector(
                    ".gift-select-button"
                );


            button.addEventListener(
                "click",
                function () {

                    const index =
                        selectedGifts.indexOf(id);


                    /*
                     * REMOVE SELECTION
                     */

                    if (index !== -1) {

                        selectedGifts.splice(
                            index,
                            1
                        );

                        saveSelections();

                        renderProducts();

                        return;
                    }


                    /*
                     * MAXIMUM 5
                     */

                    if (
                        selectedGifts.length >=
                        maxGifts
                    ) {

                        alert(
                            "You can only pick 5 free gifts."
                        );

                        return;
                    }


                    /*
                     * ADD SELECTION
                     */

                    selectedGifts.push(id);

                    saveSelections();

                    renderProducts();


                    /*
                     * WHEN 5 ARE PICKED
                     */

                    if (
                        selectedGifts.length ===
                        maxGifts
                    ) {

                        updateGiftProgress();

                        goToShop();

                    }

                }
            );

            grid.appendChild(card);

        });


        updateGiftProgress();

    }


    /*
     * PURCHASE PROGRESS
     *
     * The progress is based on actual
     * qualifying shop purchases.
     */

    function updatePurchaseProgress() {

        const cart =
            typeof getCartTotal === "function"
                ? Number(getCartTotal())
                : 0;


        const amount =
            Math.min(cart, requiredAmount);


        const percentage =
            Math.min(
                (amount / requiredAmount) * 100,
                100
            );


        purchaseAmount.textContent =
            `₦${amount.toLocaleString()} / ₦${requiredAmount.toLocaleString()}`;


        purchaseProgress.style.width =
            percentage + "%";


        if (selectedGifts.length < maxGifts) {

            purchaseNote.textContent =
                "Pick all 5 free gifts first.";

            return;
        }


        const remaining =
            Math.max(
                requiredAmount - amount,
                0
            );


        if (remaining > 0) {

            purchaseNote.textContent =
                `₦${remaining.toLocaleString()} more to go to take away your 5 gifts.`;

        } else {

            purchaseNote.textContent =
                "✓ ₦50,000 reached! Proceeding to checkout...";

            setTimeout(function () {

                if (
                    window.location.href.indexOf(
                        "checkout"
                    ) === -1
                ) {

                    if (
                        typeof checkout === "function"
                    ) {

                        checkout();

                    }

                }

            }, 800);

        }

    }


    renderProducts();

    updatePurchaseProgress();


    /*
     * UPDATE WHEN CART CHANGES
     */

    setInterval(
        updatePurchaseProgress,
        500
    );

});

</script>

</body>
</html>
