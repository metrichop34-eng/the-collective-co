<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO</title>

    <meta name="google-site-verification" content="JOUP25pT9IB8epHfjOO6u6NXHKwzKivZdHbyCZkrK34">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     NAVIGATION
========================= -->

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="#" id="aboutBtn">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>

    <button id="accountBtn" class="account-button" type="button">
        Account
    </button>
</nav>


<!-- =========================
     HOME HERO
========================= -->

<main class="hero">

    <h1>THE COLLECTIVE.CO</h1>

    <p>Everything you love, all in one place.</p>

    <button class="shop-button" id="shopNowBtn" type="button">
        SHOP NOW
    </button>

</main>


<!-- =========================
     ABOUT POPUP
========================= -->

<div id="aboutPopup" class="about-popup">

    <div class="about-box">

        <button id="aboutClose" class="about-close" type="button">
            ×
        </button>

        <h2>About THE COLLECTIVE.CO</h2>

        <p>
            Everything you love, all in one place.
        </p>

        <p>
            THE COLLECTIVE.CO brings together beauty, fashion,
            accessories, electronics and more in one place.
        </p>

    </div>

</div>


<!-- =========================
     ACCOUNT POPUP
========================= -->

<div id="accountPopup" class="account-popup">

    <div class="account-box">

        <button id="closeAccount" class="close-account" type="button">
            ×
        </button>

        <h2>Welcome!</h2>

        <p>Would you like to:</p>

        <button id="signupTab" class="account-choice" type="button">
            SIGN UP
        </button>

        <button id="loginTab" class="account-choice" type="button">
            LOGIN
        </button>

    </div>

</div>


<!-- =========================
     HOME JAVASCRIPT
========================= -->

<script>
    document.addEventListener("DOMContentLoaded", () => {

        /* SHOP NOW */
        const shopNowBtn = document.getElementById("shopNowBtn");
        if (shopNowBtn) {
            shopNowBtn.addEventListener("click", () => {
                window.location.href = "shop.html";
            });
        }

        /* ABOUT POPUP */
        const aboutBtn = document.getElementById("aboutBtn");
        const aboutPopup = document.getElementById("aboutPopup");
        const aboutClose = document.getElementById("aboutClose");

        if (aboutBtn && aboutPopup) {
            aboutBtn.addEventListener("click", (event) => {
                event.preventDefault();
                aboutPopup.style.display = "flex";
            });
        }

        if (aboutClose && aboutPopup) {
            aboutClose.addEventListener("click", () => {
                aboutPopup.style.display = "none";
            });
        }

        if (aboutPopup) {
            aboutPopup.addEventListener("click", (event) => {
                if (event.target === aboutPopup) {
                    aboutPopup.style.display = "none";
                }
            });
        }

        /* ACCOUNT POPUP */
        const accountBtn = document.getElementById("accountBtn");
        const accountPopup = document.getElementById("accountPopup");
        const closeAccount = document.getElementById("closeAccount");

        if (accountBtn && accountPopup) {
            accountBtn.addEventListener("click", () => {
                accountPopup.style.display = "flex";
            });
        }

        if (closeAccount && accountPopup) {
            closeAccount.addEventListener("click", () => {
                accountPopup.style.display = "none";
            });
        }

        if (accountPopup) {
            accountPopup.addEventListener("click", (event) => {
                if (event.target === accountPopup) {
                    accountPopup.style.display = "none";
                }
            });
        }

        /* SIGN UP & LOGIN REDIRECTS */
        const signupTab = document.getElementById("signupTab");
        if (signupTab) {
            signupTab.addEventListener("click", () => {
                window.location.href = "signup.html";
            });
        }

        const loginTab = document.getElementById("loginTab");
        if (loginTab) {
            loginTab.addEventListener("click", () => {
                window.location.href = "login.html";
            });
        }

    });
</script>

</body>
</html>
