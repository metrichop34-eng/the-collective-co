<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | THE COLLECTIVE.CO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVIGATION -->
<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>
</nav>

<!-- SIGNUP CONTAINER -->
<div class="shop-header">

    <h1>SIGN UP</h1>

    <p>Create your THE COLLECTIVE.CO account.</p>

    <div class="product" style="margin-top: 30px;">

        <h2>Create Account</h2>

        <input
            type="text"
            id="signupName"
            placeholder="Name"
        >

        <br><br>

        <input
            type="email"
            id="signupEmail"
            placeholder="Email"
        >

        <br><br>

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
        >

        <br><br>

        <p
            id="signupError"
            style="display: none; color: #B23A48; font-size: 13px; margin-bottom: 15px;"
        ></p>

        <button
            class="shop-button"
            id="createAccountBtn"
            type="button"
        >
            CREATE ACCOUNT
        </button>

        <p style="margin-top: 20px;">
            Already have an account?
            <a href="login.html" style="color: #304B52; font-weight: bold;">LOGIN</a>
        </p>

    </div>

    <br>

    <a href="index.html" style="color: #6F858A; text-decoration: none; font-size: 14px;">BACK HOME</a>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const nameInput = document.getElementById("signupName");
        const emailInput = document.getElementById("signupEmail");
        const passwordInput = document.getElementById("signupPassword");
        const errorMsg = document.getElementById("signupError");
        const signupBtn = document.getElementById("createAccountBtn");

        signupBtn?.addEventListener("click", () => {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!name || !email || !password) {
                errorMsg.textContent = "Please fill in all fields.";
                errorMsg.style.display = "block";
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = "Password must be at least 6 characters long.";
                errorMsg.style.display = "block";
                return;
            }

            // Save user session
            localStorage.setItem("collectiveLoggedIn", "true");
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("collectiveUser", name);
            localStorage.setItem("user", name);
            localStorage.setItem("collectiveEmail", email);
            localStorage.setItem("email", email);

            // Redirect to Profile Page
            window.location.href = "profile.html";
        });
    });
</script>

<script src="script.js"></script>

</body>
</html>
