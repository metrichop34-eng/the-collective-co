<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO - Admin Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            background: #FFFDF8;
            color: #304B52;
            margin: 0;
            padding: 0;
        }

        .admin-header {
            background: #304B52;
            color: #FFFDF8;
            padding: 28px 24px;
        }
        .header-inner {
            max-width: 1050px;
            margin: 0 auto;
        }
        .admin-header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0.3px;
        }

        .tab-bar {
            max-width: 1050px;
            margin: 24px auto 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 12px;
        }
        .tab-btn {
            padding: 12px 26px;
            border-radius: 25px;
            border: 1px solid #304B52;
            background: #FFFDF8;
            color: #304B52;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #304B52;
            color: #FFFDF8;
        }

        .main-content {
            max-width: 1050px;
            margin: 22px auto 50px auto;
            padding: 0 20px;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }

        .sales-summary {
            background: #E8F1F2;
            border: 1px solid #A8C9CE;
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .sales-label {
            font-size: 13px;
            font-weight: bold;
            color: #6F858A;
            text-transform: uppercase;
        }
        .sales-amount {
            font-size: 26px;
            font-weight: bold;
            color: #304B52;
            margin-top: 4px;
        }
        .sales-count {
            font-size: 14px;
            color: #304B52;
            font-weight: bold;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 25px;
        }
        @media (max-width: 820px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        .admin-card {
            background: #FFFDF8;
            border: 1px solid #DCEFF2;
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
        }
        .admin-card h2 {
            color: #304B52;
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #6F858A;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #A8C9CE;
            border-radius: 10px;
            background-color: #FFFDF8;
            color: #304B52;
            box-sizing: border-box;
            outline: none;
        }
        .help-text {
            font-size: 12px;
            color: #6F858A;
            margin-top: 4px;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #DCEFF2;
            color: #304B52;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #E8F1F2;
        }
        .stock-pill {
            display: inline-block;
            background: #E8F1F2;
            color: #304B52;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin: 2px 2px 0 0;
        }
        .btn-edit {
            background: #304B52;
            color: #FFFDF8;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 4px;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .btn-delete {
            background: #dc3545;
            color: #FFFDF8;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .status-select {
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 12px;
            width: auto;
        }
        .error-box {
            color: #b02a37;
            background: #f8d7da;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="header-inner">
            <h1>Admin Dashboard</h1>
        </div>
    </header>

    <div class="tab-bar">
        <button id="ordersTabBtn" class="tab-btn active" type="button">Orders</button>
        <button id="productsTabBtn" class="tab-btn" type="button">Products</button>
    </div>

    <main class="main-content">
        <section id="ordersPanel" class="tab-panel active">
            <div class="sales-summary">
                <div>
                    <div class="sales-label">Total Sales</div>
                    <div id="totalSalesAmount" class="sales-amount">₦0</div>
                </div>
                <div id="totalOrdersCount" class="sales-count">0 Orders</div>
            </div>

            <div class="admin-card">
                <h2>Customer Orders</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Customer Details</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersTable">
                        <tr><td colspan="4" style="text-align: center;">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="productsPanel" class="tab-panel">
            <div class="products-grid">
                <div class="admin-card">
                    <h2>Add New Product</h2>
                    <form id="productForm">
                        <div class="form-group">
                            <label for="productName">Product Name</label>
                            <input type="text" id="productName" required placeholder="e.g. Polka Dot Scrunchie">
                        </div>

                        <div class="form-group">
                            <label for="productPrice">Price (₦)</label>
                            <input type="number" id="productPrice" required placeholder="e.g. 5000">
                        </div>

                        <div class="form-group">
                            <label for="productCategory">Category</label>
                            <select id="productCategory">
                                <option value="accessories">Accessories</option>
                                <option value="clothing">Clothing</option>
                                <option value="shoes">Shoes</option>
                                <option value="bags">Bags</option>
                                <option value="skincare">Skincare</option>
                                <option value="others">Others</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="colorStockInput">Stock Per Color</label>
                            <input type="text" id="colorStockInput" placeholder="e.g. Pink: 1, Black: 4, White: 0">
                            <span class="help-text">Separate colors with commas using <strong>Color: Quantity</strong>.</span>
                        </div>

                        <div class="form-group">
                            <label for="productImage">Product Image File</label>
                            <input type="file" id="productImage" accept="image/*" required>
                        </div>

                        <button id="submitBtn" type="submit" style="display: block; width: 100%; padding: 14px; background-color: #304B52; color: #FFFDF8; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px;">
                            Save Product
                        </button>
                    </form>
                </div>

                <div class="admin-card">
                    <h2>All Products</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Item &amp; Color Stock</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductTable">
                            <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAiFa8h-LM0tKlfLZ9OyqlsgkMtDU5oj1s",
            authDomain: "the-collectiveco-orders.firebaseapp.com",
            projectId: "the-collectiveco-orders",
            storageBucket: "the-collectiveco-orders.firebasestorage.app",
            messagingSenderId: "543435699346",
            appId: "1:543435699346:web:886ff03c71fb546dc7a24b",
            measurementId: "G-7GP25TW6JH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ordersTabBtn = document.getElementById("ordersTabBtn");
        const productsTabBtn = document.getElementById("productsTabBtn");
        const ordersPanel = document.getElementById("ordersPanel");
        const productsPanel = document.getElementById("productsPanel");

        ordersTabBtn.addEventListener("click", () => {
            ordersTabBtn.classList.add("active");
            productsTabBtn.classList.remove("active");
            ordersPanel.classList.add("active");
            productsPanel.classList.remove("active");
        });

        productsTabBtn.addEventListener("click", () => {
            productsTabBtn.classList.add("active");
            ordersTabBtn.classList.remove("active");
            productsPanel.classList.add("active");
            ordersPanel.classList.remove("active");
        });

        const productForm = document.getElementById("productForm");
        const adminProductTable = document.getElementById("adminProductTable");
        const adminOrdersTable = document.getElementById("adminOrdersTable");
        const totalSalesAmount = document.getElementById("totalSalesAmount");
        const totalOrdersCount = document.getElementById("totalOrdersCount");
        const submitBtn = document.getElementById("submitBtn");

        let cachedProducts = {};

        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function parseColorStock(rawText) {
            const colorStock = {};
            let totalStock = 0;

            if (!rawText || !rawText.trim()) {
                return { colorStock, totalStock };
            }

            rawText.split(",").forEach(part => {
                const [rawColor, rawQty] = part.split(":");
                const colorName = (rawColor || "").trim();
                const qty = Math.max(0, Number((rawQty || "").trim()) || 0);

                if (colorName) {
                    const formattedColor = colorName.charAt(0).toUpperCase() + colorName.slice(1);
                    colorStock[formattedColor] = qty;
                    totalStock += qty;
                }
            });

            return { colorStock, totalStock };
        }

        function colorStockToText(colorStock) {
            if (!colorStock || typeof colorStock !== "object") return "";
            return Object.entries(colorStock)
                .map(([color, qty]) => `${color}: ${qty}`)
                .join(", ");
        }

        function formatColorBadges(colorStock) {
            if (!colorStock || typeof colorStock !== "object") return "";
            const entries = Object.entries(colorStock);
            if (entries.length === 0) return "";

            return `<div style="margin-top:4px;">` + entries.map(([color, qty]) => {
                const label = qty > 0 ? `${color}: ${qty}` : `${color}: Out`;
                return `<span class="stock-pill">${label}</span>`;
            }).join("") + `</div>`;
        }

        async function loadAdminInventory() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                adminProductTable.innerHTML = "";
                cachedProducts = {};

                if (querySnapshot.empty) {
                    adminProductTable.innerHTML = `<tr><td colspan="4" style="text-align: center;">No products found.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnapshot) => {
                    const product = docSnapshot.data();
                    cachedProducts[docSnapshot.id] = product;

                    const imgUrl = product.imageUrl || product.image || '';
                    const colorBadges = formatColorBadges(product.colorStock);
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${imgUrl ? `<img src="${imgUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:6px;">` : '🛍️'}</td>
                        <td>
                            <strong>${product.name || product.listing || 'Unnamed'}</strong>
                            <div style="font-size:12px; color:#6F858A; text-transform:capitalize;">${product.category || 'others'}</div>
                            ${colorBadges}
                        </td>
                        <td>₦${Number(product.price || 0).toLocaleString()}</td>
                        <td>
                            <button class="btn-edit" data-id="${docSnapshot.id}">Edit</button>
                            <button class="btn-delete" data-id="${docSnapshot.id}">Delete</button>
                        </td>
                    `;
                    adminProductTable.appendChild(row);
                });

                document.querySelectorAll(".btn-edit").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const id = e.target.getAttribute("data-id");
                        const current = cachedProducts[id] || {};

                        const nextName = prompt("Product Name:", current.name || current.listing || "");
                        if (nextName === null) return;

                        const nextCategory = prompt("Category (accessories, clothing, shoes, bags, skincare, others):", current.category || "others");
                        if (nextCategory === null) return;

                        const nextPriceInput = prompt("Price (₦):", current.price || 0);
                        if (nextPriceInput === null) return;

                        const nextStockText = prompt("Stock Per Color (e.g. Pink: 1, Black: 4):", colorStockToText(current.colorStock));
                        if (nextStockText === null) return;

                        const { colorStock, totalStock } = parseColorStock(nextStockText);
                        const cleanName = (nextName || current.name || current.listing || "Unnamed").trim();

                        await updateDoc(doc(db, "products", id), {
                            name: cleanName,
                            listing: cleanName,
                            category: (nextCategory || "others").trim().toLowerCase(),
                            price: Math.max(0, Number(nextPriceInput) || 0),
                            colorStock: colorStock,
                            stock: totalStock
                        });
                        loadAdminInventory();
                    });
                });

                document.querySelectorAll(".btn-delete").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const id = e.target.getAttribute("data-id");
                        if (confirm("Delete this product?")) {
                            await deleteDoc(doc(db, "products", id));
                            loadAdminInventory();
                        }
                    });
                });
            } catch (err) {
                console.error("Error loading inventory:", err);
                adminProductTable.innerHTML = `<tr><td colspan="4"><div class="error-box">Could not load inventory: ${err.message}</div></td></tr>`;
            }
        }

        async function loadAdminOrders() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                adminOrdersTable.innerHTML = "";

                if (querySnapshot.empty) {
                    totalSalesAmount.textContent = "₦0";
                    totalOrdersCount.textContent = "0 Orders";
                    adminOrdersTable.innerHTML = `<tr><td colspan="4" style="text-align: center;">No orders found.</td></tr>`;
                    return;
                }

                let totalSales = 0;
                let count = 0;

                querySnapshot.forEach((docSnapshot) => {
                    const order = docSnapshot.data();
                    const numericTotal = Number(order.total || order.totalAmount || 0) || 0;
                    const status = order.status || "Pending";

                    if (status.toLowerCase() !== "cancelled") {
                        totalSales += numericTotal;
                    }
                    count += 1;

                    const customer = order.customerName || order.name || order.customer || "Customer";
                    const contactLines = [
                        order.phone,
                        order.email,
                        order.address || order.location || order.deliveryZone
                    ].filter(Boolean);

                    const itemsText = Array.isArray(order.items)
                        ? order.items.map(i => `${i.name || i.title || "Item"}${i.color ? ` (${i.color})` : ""} x${i.qty || i.quantity || 1}`).join(", ")
                        : (order.itemsSummary || order.item || "Order items");

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>
                            <strong>${customer}</strong>
                            ${contactLines.map(line => `<div style="font-size:12px; color:#6F858A;">${line}</div>`).join("")}
                        </td>
                        <td>${itemsText}</td>
                        <td>₦${numericTotal.toLocaleString()}</td>
                        <td>
                            <select class="status-select" data-id="${docSnapshot.id}">
                                <option value="Pending" ${status === "Pending" ? "selected" : ""}>Pending</option>
                                <option value="Confirmed" ${status === "Confirmed" ? "selected" : ""}>Confirmed</option>
                                <option value="Delivered" ${status === "Delivered" ? "selected" : ""}>Delivered</option>
                                <option value="Cancelled" ${status === "Cancelled" ? "selected" : ""}>Cancelled</option>
                            </select>
                        </td>
                    `;
                    adminOrdersTable.appendChild(row);
                });

                totalSalesAmount.textContent = `₦${totalSales.toLocaleString()}`;
                totalOrdersCount.textContent = `${count} ${count === 1 ? "Order" : "Orders"}`;

                document.querySelectorAll(".status-select").forEach(select => {
                    select.addEventListener("change", async (e) => {
                        const orderId = e.target.getAttribute("data-id");
                        const nextStatus = e.target.value;
                        await updateDoc(doc(db, "orders", orderId), { status: nextStatus });
                        loadAdminOrders();
                    });
                });
            } catch (err) {
                console.error("Error loading orders:", err);
                adminOrdersTable.innerHTML = `<tr><td colspan="4"><div class="error-box">Could not load orders: ${err.message}</div></td></tr>`;
            }
        }

        productForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("productName").value.trim();
            const price = Number(document.getElementById("productPrice").value);
            const category = document.getElementById("productCategory").value;
            const rawColorStock = document.getElementById("colorStockInput").value;
            const fileInput = document.getElementById("productImage");
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select an image file.");
                return;
            }

            const { colorStock, totalStock } = parseColorStock(rawColorStock);

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "Processing Image & Saving...";

                const base64Image = await convertImageToBase64(file);

                await addDoc(collection(db, "products"), {
                    name: name,
                    listing: name,
                    price: price,
                    category: category,
                    colorStock: colorStock,
                    stock: totalStock,
                    imageUrl: base64Image,
                    image: base64Image,
                    createdAt: new Date()
                });

                alert("Product added successfully!");
                productForm.reset();
                loadAdminInventory();
            } catch (error) {
                alert("Error: " + error.message);
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Save Product";
            }
        });

        loadAdminInventory();
        loadAdminOrders();
    </script>
</body>
</html>
