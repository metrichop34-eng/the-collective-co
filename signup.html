<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | THE COLLECTIVE.CO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shop.html">Category</a>
    <a href="profile.html">Profile</a>
</nav>

<main>

    <section class="shop-header">
        <p class="bear">✦</p>
        <h1>JOIN THE COLLECTIVE</h1>
        <p>Create your account and start earning rewards.</p>
    </section>

    <section class="auth-container">

        <h2>CREATE ACCOUNT</h2>

        <label for="signupName">Name</label>
        <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
            autocomplete="name"
        >

        <label for="signupEmail">Email</label>
        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
        >

        <label for="signupPassword">Password</label>
        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            autocomplete="new-password"
        >

        <button type="button" id="createAccountBtn">
            CREATE ACCOUNT
        </button>

        <p style="text-align:center; margin-top:20px; color:#71858a;">
            Already have an account?
            <a href="login.html" style="color:#304b52; font-weight:bold;">
                LOGIN
            </a>
        </p>

    </section>

    <div style="text-align:center; margin:25px 0 60px;">
        <a href="index.html"
           style="color:#304b52; text-decoration:none; font-weight:bold;">
            ← BACK HOME
        </a>
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
