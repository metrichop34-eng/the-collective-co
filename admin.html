<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            text-align: left;
        }
        .admin-card {
            background: #FFFDF8;
            border: 1px solid #DCEFF2;
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
        }
        .admin-card h2 {
            color: #304B52;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #6F858A;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #A8C9CE;
            border-radius: 10px;
            background-color: #FFFDF8;
            color: #304B52;
            box-sizing: border-box;
            outline: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #DCEFF2;
            color: #304B52;
        }
        th {
            background: #E8F1F2;
        }
    </style>
</head>
<body>

    <nav>
        <a href="shop.html">View Live Shop</a>
    </nav>

    <div class="admin-container">
        <!-- Add Product Form -->
        <div class="admin-card">
            <h2>Add New Product</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" required placeholder="e.g. Leather Bag">
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (₦)</label>
                    <input type="number" id="productPrice" required placeholder="e.g. 25000">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="skincare">Skincare</option>
                        <option value="accesories">Accessories</option>
                        <option value="clothing">Clothing</option>
                        <option value="shoes">Shoes</option>
                        <option value="bags">Bags</option>
                        <option value="others">Others</option>
                    </select>
                </div>

                <!-- SAVE BUTTON -->
                <button type="submit" style="display: block !important; width: 100% !important; padding: 14px !important; background-color: #304B52 !important; color: #FFFDF8 !important; border: none !important; border-radius: 25px !important; font-size: 15px !important; font-weight: bold !important; cursor: pointer !important; margin-top: 20px !important;">
                    Save Product
                </button>
            </form>
        </div>

        <!-- Inventory Table -->
        <div class="admin-card">
            <h2>Live Inventory</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminProductTable">
                    <tr><td colspan="3" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkavvOeD4GEtUsq4S-QuTU4ejedf8CiL8",
            authDomain: "the-collectiveco-orders.firebaseapp.com",
            projectId: "the-collectiveco-orders",
            storageBucket: "the-collectiveco-orders.firebasestorage.app",
            messagingSenderId: "543435699346",
            appId: "1:543435699346:web:886ff03c71fb546dc7a24b",
            measurementId: "G-7GP25TW6JH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productForm = document.getElementById("productForm");
        const adminProductTable = document.getElementById("adminProductTable");

        async function loadAdminInventory() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                adminProductTable.innerHTML = "";
                if (querySnapshot.empty) {
                    adminProductTable.innerHTML = `<tr><td colspan="3" style="text-align: center;">No products found.</td></tr>`;
                    return;
                }
                querySnapshot.forEach((docSnapshot) => {
                    const product = docSnapshot.data();
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${product.name || product.listing || 'Unnamed'}</td>
                        <td>₦${Number(product.price || 0).toLocaleString()}</td>
                        <td><button class="btn-delete" data-id="${docSnapshot.id}" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Delete</button></td>
                    `;
                    adminProductTable.appendChild(row);
                });

                document.querySelectorAll(".btn-delete").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const id = e.target.getAttribute("data-id");
                        if (confirm("Delete this product?")) {
                            await deleteDoc(doc(db, "products", id));
                            loadAdminInventory();
                        }
                    });
                });
            } catch (err) {
                console.error(err);
            }
        }

        productForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("productName").value.trim();
            const price = Number(document.getElementById("productPrice").value);
            const category = document.getElementById("category").value;

            try {
                await addDoc(collection(db, "products"), {
                    name: name,
                    listing: name,
                    price: price,
                    category: category,
                    createdAt: new Date()
                });
                alert("Product added successfully!");
                productForm.reset();
                loadAdminInventory();
            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        loadAdminInventory();
    </script>
</body>
</html>
