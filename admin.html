<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COLLECTIVE.CO - Admin Dashboard</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary: #000000;
            --accent: #333333;
            --border: #dee2e6;
            --danger: #dc3545;
            --success: #28a745;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }
        h1, h2 {
            margin: 0;
            letter-spacing: 1px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent);
        }
        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #bd2130;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #6c757d;
        }
        input, select, textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            background-color: #f1f3f5;
            font-weight: 700;
        }
        .actions-cell {
            display: flex;
            gap: 8px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>THE COLLECTIVE.CO // ADMIN</h1>
        <button id="openAddModalBtn">+ ADD NEW PRODUCT</button>
    </header>

    <div class="card">
        <h2>Product Inventory</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Listing</th>
                        <th>Category</th>
                        <th>Price (₦)</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <tr><td colspan="6" style="text-align: center;">Loading products...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add/Edit Product Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Add New Product</h2>
        <form id="productForm" style="margin-top: 20px;">
            <input type="hidden" id="productId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" required placeholder="e.g. Body Butter">
                </div>
                <div class="form-group">
                    <label>Listing Title</label>
                    <input type="text" id="listing" required placeholder="e.g. Body Butter 1">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Skincare">Skincare</option>
                        <option value="Perfume">Perfume</option>
                        <option value="Haircare">Haircare</option>
                        <option value="Apparel">Apparel</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (₦)</label>
                    <input type="number" id="price" required min="0" placeholder="5000">
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="stock" required min="0" value="10">
                </div>
                <div class="form-group">
                    <label>Size / Volume</label>
                    <input type="text" id="size" placeholder="e.g. 100 ml or ''">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Description</label>
                <textarea id="description" placeholder="Product description..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" id="closeModalBtn" style="background-color: #6c757d;">Cancel</button>
                <button type="submit" id="saveProductBtn">Save Product</button>
            </div>
        </form>
    </div>
</div>

<!-- Firebase & Admin Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // TODO: Replace with your actual Firebase configuration object
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const productTableBody = document.getElementById("productTableBody");
    const productModal = document.getElementById("productModal");
    const openAddModalBtn = document.getElementById("openAddModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const productForm = document.getElementById("productForm");
    const modalTitle = document.getElementById("modalTitle");

    let editingDocId = null;

    async function loadProducts() {
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            productTableBody.innerHTML = "";

            if (querySnapshot.empty) {
                productTableBody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No products found in Firestore. Add your first product above!</td></tr>`;
                return;
            }

            querySnapshot.forEach((docSnapshot) => {
                const prod = docSnapshot.data();
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${prod.name || ''}</strong></td>
                    <td>${prod.listing || ''}</td>
                    <td><span style="background: #e9ecef; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${prod.category || 'Uncategorized'}</span></td>
                    <td>₦${Number(prod.price || 0).toLocaleString()}</td>
                    <td>${prod.stock ?? 0}</td>
                    <td class="actions-cell">
                        <button onclick="window.editProduct('${docSnapshot.id}', '${encodeURIComponent(JSON.stringify(prod))}')">Edit</button>
                        <button class="btn-danger" onclick="window.deleteProduct('${docSnapshot.id}')">Delete</button>
                    </td>
                `;
                productTableBody.appendChild(tr);
            });
        } catch (error) {
            console.error("Error loading products:", error);
            productTableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Error loading products: ${error.message}</td></tr>`;
        }
    }

    openAddModalBtn.addEventListener("click", () => {
        editingDocId = null;
        modalTitle.textContent = "Add New Product";
        productForm.reset();
        document.getElementById("productId").value = "";
        productModal.style.display = "flex";
    });

    closeModalBtn.addEventListener("click", () => {
        productModal.style.display = "none";
    });

    window.editProduct = function(id, encodedData) {
        editingDocId = id;
        modalTitle.textContent = "Edit Product";
        const prod = JSON.parse(decodeURIComponent(encodedData));
        
        document.getElementById("productId").value = id;
        document.getElementById("name").value = prod.name || "";
        document.getElementById("listing").value = prod.listing || "";
        document.getElementById("category").value = prod.category || "";
        document.getElementById("price").value = prod.price || "";
        document.getElementById("stock").value = prod.stock || 10;
        document.getElementById("size").value = prod.size || "";
        document.getElementById("description").value = prod.description || "";

        productModal.style.display = "flex";
    };

    window.deleteProduct = async function(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            try {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            } catch (error) {
                alert("Error deleting product: " + error.message);
            }
        }
    };

    productForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const productData = {
            name: document.getElementById("name").value.trim(),
            listing: document.getElementById("listing").value.trim(),
            category: document.getElementById("category").value,
            price: Number(document.getElementById("price").value),
            stock: Number(document.getElementById("stock").value),
            size: document.getElementById("size").value.trim(),
            description: document.getElementById("description").value.trim(),
            colors: [],
            sizes: []
        };

        try {
            if (editingDocId) {
                const docRef = doc(db, "products", editingDocId);
                await updateDoc(docRef, productData);
            } else {
                const docRef = await addDoc(collection(db, "products"), productData);
                await updateDoc(docRef, { id: productData.listing.replace(/\s+/g, '-') });
            }

            productModal.style.display = "none";
            loadProducts();
        } catch (error) {
            console.error("Error saving product:", error);
            alert("Failed to save product: " + error.message);
        }
    });

    loadProducts();
</script>

</body>
</html>
